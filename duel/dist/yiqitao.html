  background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%), radial-gradient(circle at 90% 90%, rgba(160,130,80,.18), transparent 50%); }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
.screen { min-height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

/* 共用 */
.pt { display: block; width: 52px; height: 52px; border-radius: 8px; background: #e6dcc4; object-fit: cover; }
.btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; min-height: 54px; padding: 10px 16px;
  border: 2px solid var(--edge); border-radius: 12px; background: var(--panel); font-size: 19px; font-weight: 700; box-shadow: 0 3px 0 var(--edge); }
.btn small { font-size: 12px; font-weight: 400; color: var(--muted); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.btn.primary { background: var(--red); border-color: #7e2219; color: #fff; box-shadow: 0 3px 0 #7e2219; }
.btn.primary small { color: #f6d8d2; }
.btn.ghost { background: transparent; box-shadow: none; }
.menu { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.chip { border: 1px solid var(--edge); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 8px; background: var(--hud); color: #f3e6c8; border-bottom: 3px solid var(--red); }
.bar .back { width: 40px; height: 40px; border: 0; background: none; color: #f3e6c8; font-size: 32px; line-height: 1; }
.bar-t { flex: 1; font-size: 18px; font-weight: 700; }
.bar-r { font-size: 13px; opacity: .8; padding-right: 8px; }
.paper { margin: 16px; padding: 16px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; line-height: 1.7; font-size: 15px; }
.paper ul { padding-left: 20px; margin: 8px 0 0; }

/* 標題 */
.title { justify-content: space-between; }
.logo { text-align: center; padding-top: 18px; }
.logo-sub { font-size: 20px; letter-spacing: 12px; color: var(--muted); }
.logo-main { font-family: Pixel12, Body; font-size: 64px; color: var(--red); letter-spacing: 6px; text-shadow: 0 3px 0 #fff, 0 5px 0 rgba(0,0,0,.12); }
.title-vs { position: relative; display: flex; justify-content: center; align-items: flex-end; height: 200px; }
.title-vs::after { content: ''; position: absolute; bottom: 0; left: 15%; right: 15%; height: 14px; border-radius: 50%; background: rgba(80,60,30,.2); }
.title-vs .pt { width: 160px; height: 200px; background: none; border-radius: 0; }
.title-vs .tl { animation: bobL 2.4s ease-in-out infinite; }
.title-vs .tr { transform: scaleX(-1); animation: bobR 2.4s ease-in-out infinite .4s; }
.tvs { position: absolute; z-index: 2; top: 40%; font-family: Pixel12, Body; font-size: 48px; color: var(--red); text-shadow: 0 0 8px #fff; }
.foot { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 16px; font-size: 13px; color: var(--muted); }
@keyframes bobL { 50% { transform: translateY(-6px); } }
@keyframes bobR { 50% { transform: scaleX(-1) translateY(-6px); } }

.rps { display: flex; gap: 8px; margin: 10px 0; }
.rps-i { flex: 1; text-align: center; padding: 8px 4px; border-radius: 10px; background: #fff8e8; border: 1px solid var(--edge); font-weight: 700; }
.rps-i b { display: block; font-size: 24px; }
.rps-i small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }

/* 排名 */
.tabs { display: flex; gap: 8px; padding: 10px 12px; }
.tab { flex: 1; border: 1px solid var(--edge); background: var(--panel); border-radius: 999px; padding: 8px; font-weight: 700; }
.tab.on { background: var(--hud); color: #f3e6c8; border-color: var(--hud); }
.rank-list { padding: 0 12px 24px; }
.rank-row { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; }
.rank-row.top { border-color: var(--gold); background: linear-gradient(90deg, #fff4d6, var(--panel)); }
.rk { width: 30px; text-align: center; font-family: Pixel12, Body; font-size: 20px; color: var(--muted); }
.rank-row.top .rk { color: var(--gold); }
.rk-n { flex: 1; min-width: 0; }
.rk-n b { display: block; font-size: 17px; }
.rk-n small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.rk-s { display: flex; gap: 6px; }
.sc { width: 34px; text-align: center; font-size: 16px; font-weight: 700; color: var(--muted); }
.sc small { display: block; font-size: 10px; font-weight: 400; }
.sc.on { color: var(--red); }
.lock { margin-left: 6px; padding: 0 5px; font-size: 10px; font-style: normal; font-weight: 400; color: var(--muted); border: 1px solid var(--edge); border-radius: 4px; vertical-align: 2px; }

/* 詳情底部彈出 */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; background: rgba(20,14,8,.5); display: flex; align-items: flex-end; animation: fade .2s; }
.sheet { width: 100%; background: var(--panel); border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .25s ease-out; }
.sh-top { display: flex; gap: 12px; }
.sh-pt { width: 150px; height: 188px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 30%, #fff), #e6dcc4); overflow: hidden; }
.sh-pt .pt { width: 100%; height: 100%; background: none; border-radius: 0; object-fit: contain; }
.sh-info { flex: 1; min-width: 0; }
.sh-rank { font-size: 12px; color: var(--gold); font-weight: 700; }
.sh-name { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
.sh-name small { font-size: 13px; color: var(--muted); margin-left: 6px; font-weight: 400; }
.stat { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 5px 0; }
.stat .track { flex: 1; height: 8px; background: #e2d6ba; border-radius: 4px; overflow: hidden; }
.stat .track div { height: 100%; }
.stat b { width: 28px; text-align: right; }
.sh-sp { margin-top: 8px; padding: 8px; background: #fff8e8; border-radius: 8px; border: 1px dashed var(--edge); }
.sh-sp b { display: block; color: var(--red); }
.sh-sp small { font-size: 12px; color: var(--muted); }
.sh-btns { display: flex; gap: 10px; margin-top: 14px; }
.locked-note { flex: 2; display: grid; place-items: center; font-size: 13px; color: var(--muted); text-align: center; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(100%); } }

/* 選將 */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; }
.card { position: relative; padding: 6px 4px; text-align: center; background: var(--panel); border: 2px solid color-mix(in srgb, var(--c) 50%, var(--edge)); border-radius: 10px; }
.card .pt { width: 100%; height: auto; aspect-ratio: 1; background: color-mix(in srgb, var(--c) 18%, #f1e8d4); }
.card .cn { font-weight: 700; font-size: 15px; margin-top: 4px; }
.card .cw { font-size: 11px; color: var(--muted); }
.card.locked .pt { filter: brightness(0) opacity(.35); }
.card.locked .cn { color: var(--muted); }
.card.taken { outline: 3px solid var(--red); }

/* 過關路線 */
.ld-me { display: flex; align-items: center; gap: 12px; margin: 12px 16px 4px; padding: 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; }
.ld-me b { display: block; font-size: 20px; }
.ld-me small { color: var(--red); }
.ld-list { flex: 1; padding: 8px 16px; }
.ld-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin-bottom: 5px; border-radius: 10px; }
.ld-row .pt { width: 40px; height: 40px; }
.ld-row .pt.q { display: grid; place-items: center; font-size: 20px; color: var(--muted); }
.ld-no { width: 26px; text-align: center; font-family: Pixel12, Body; font-size: 18px; color: var(--muted); }
.ld-n { flex: 1; font-weight: 700; }
.ld-n small { margin-left: 8px; font-weight: 400; color: var(--muted); font-size: 12px; }
.ld-st { font-size: 13px; font-weight: 700; color: var(--green); }
.ld-row.done { opacity: .55; }
.ld-row.now { background: var(--panel); border: 2px solid var(--red); }
.ld-row.now .ld-st { color: var(--red); }

/* 對峙 */
.versus { background: linear-gradient(170deg, #2a2018 0%, #3a2a1c 50%, #231c15 100%); color: #f3e6c8; justify-content: space-between; }
.vs-side { position: relative; height: 38dvh; display: flex; align-items: flex-end; padding: 0 16px; }
.vs-side .pt { width: auto; height: 100%; aspect-ratio: 4/5; background: none; border-radius: 0; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--c) 70%, transparent)); }
.vs-side.top { flex-direction: row-reverse; animation: inR .5s ease-out; }
.vs-side.top .pt { transform: scaleX(-1); }
.vs-side.bot { animation: inL .5s ease-out; }
.vs-name { font-size: 30px; font-weight: 700; padding: 0 10px 20px; }
.vs-name small { display: block; font-size: 14px; color: color-mix(in srgb, var(--c) 60%, #fff); }
.vs-mid { text-align: center; font-size: 18px; letter-spacing: 6px; }
.vs-mid b { display: block; font-family: Pixel12, Body; font-size: 56px; color: #ff6a4a; letter-spacing: 4px; animation: pulse .8s ease-in-out infinite alternate; }
@keyframes inR { from { transform: translateX(110%); } }
@keyframes inL { from { transform: translateX(-110%); } }
@keyframes pulse { to { transform: scale(1.08); } }

/* 戰鬥 */
.fight { height: 100dvh; min-height: 0; }
.fbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: var(--hud); color: #f3e6c8; border-bottom: 3px solid var(--red); }
.fbar .chip { background: transparent; color: #f3e6c8; border-color: #5a4a36; }
.fbar-t { font-weight: 700; font-size: 16px; }
.hud { padding: 6px 12px; }
.hud-n { display: flex; align-items: baseline; gap: 8px; }
.hud-n b { font-size: 18px; }
.hud-n small { font-size: 12px; color: var(--muted); }
.hud-n .st { margin-left: auto; font-size: 12px; font-weight: 700; color: #7b4fb0; }
.hp { position: relative; height: 16px; margin-top: 3px; background: #ddd0b2; border: 1px solid #a8956c; border-radius: 8px; overflow: hidden; }
.hp-fill { height: 100%; transition: width .35s; border-radius: 8px 0 0 8px; }
.hp-t { position: absolute; right: 6px; top: 0; font-size: 11px; line-height: 14px; font-weight: 700; text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
.pips { display: flex; gap: 4px; margin-top: 4px; }
.pips i { width: 26px; height: 8px; border-radius: 4px; background: #ddd0b2; border: 1px solid #b8a67e; }
.pips i.on { background: var(--gold); border-color: #9a6f14; box-shadow: 0 0 6px rgba(230,170,40,.8); }
.pips i.x { opacity: .25; }
.hud.full .pips i.on { animation: glow .6s ease-in-out infinite alternate; }
@keyframes glow { to { background: #ffd34a; } }

.arena { position: relative; flex: 1; min-height: 210px; overflow: hidden; margin: 0 8px; border-radius: 14px;
  background: linear-gradient(#f6eedb 0%, #ead9b4 62%, #d6c094 62.5%, #cbb284 100%); border: 1px solid var(--edge); }
.arena.flash::before { content: ''; position: absolute; inset: 0; background: rgba(255,250,230,.75); animation: fade .25s reverse; z-index: 2; }
.arena.shake { animation: shake .3s; }
.ftr { position: absolute; bottom: 4%; width: 46%; height: 88%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; transition: transform .6s, opacity .6s, filter .6s; }
.ftr.a { left: 2%; }
.ftr.b { right: 2%; }
.ftr .body { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.ftr .body .pt { width: auto; height: 100%; max-width: 100%; aspect-ratio: 4/5; background: none; border-radius: 0; object-fit: contain; }
.ftr.b .body .pt { transform: scaleX(-1); }
.ftr .shadow { position: absolute; bottom: -4px; width: 70%; height: 12px; border-radius: 50%; background: rgba(80,60,30,.25); }
.ftr .body.lunge { animation: lungeA .42s ease-in-out; }
.ftr.b .body.lunge { animation: lungeB .42s ease-in-out; }
.ftr .body.hit { animation: hit .35s; }
.ftr .body.hit-big { animation: hit .5s 1, hitbig .5s; }
.ftr .body.aura { animation: aura .5s; }
.ftr.down { transform: translateY(16%) rotate(-10deg); opacity: .4; filter: grayscale(1); }
.ftr.b.down { transform: translateY(16%) rotate(10deg); }
.ftr.victor .body { animation: victory .5s ease-out 2; }
.bubble { position: absolute; top: 0; z-index: 2; padding: 3px 10px; border-radius: 999px; background: #fff; border: 2px solid var(--c); font-weight: 700; font-size: 14px; opacity: 0; transform: scale(.6); transition: .15s; }
.bubble.show { opacity: 1; transform: none; }
.bubble.mv-special { background: var(--red); color: #fff; border-color: #7e2219; }
.bubble.mv-stunned { background: #e9e0f4; color: #5e4280; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.pop { position: absolute; top: 30%; font-family: Pixel12, Body; font-size: 30px; color: var(--red); text-shadow: 0 2px 0 #fff, 0 0 6px #fff; white-space: nowrap; animation: popUp 1s ease-out forwards; }
.pop.at-a { left: 12%; }
.pop.at-b { right: 12%; }
.pop.at-mid { left: 50%; transform: translateX(-50%); }
.pop.big { font-size: 42px; color: #d8761a; }
.pop.sp { color: #d8761a; }
.pop.heal { color: var(--green); }
.pop.charge { color: var(--gold); font-size: 22px; }
.pop.info { font-size: 20px; color: var(--ink); font-family: Body; font-weight: 700; }
.banner { position: absolute; left: 0; right: 0; top: 34%; z-index: 4; padding: 10px 0; text-align: center; color: #fff;
  background: linear-gradient(90deg, transparent, var(--c) 18%, var(--c) 82%, transparent); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.banner.show { animation: slash .35s ease-out; }
.banner small { display: block; font-size: 13px; opacity: .9; }
.banner b { font-family: Pixel12, Body; font-size: 40px; letter-spacing: 4px; }
.banner.end b { font-size: 36px; }
@keyframes slash { from { transform: scaleX(0); } }
@keyframes lungeA { 45% { transform: translateX(42%) rotate(5deg); } }
@keyframes lungeB { 45% { transform: translateX(-42%) rotate(-5deg); } }
@keyframes hit { 0%,100% { transform: none; filter: none; } 20% { transform: translateX(-8px); filter: brightness(1.7) sepia(1) hue-rotate(-30deg) saturate(4); } 45% { transform: translateX(7px); } 70% { transform: translateX(-4px); } }
@keyframes hitbig { 30% { filter: brightness(2.2) sepia(1) hue-rotate(-30deg) saturate(5); } }
@keyframes aura { 50% { filter: drop-shadow(0 0 14px #ffc83a) brightness(1.15); transform: translateY(-4px); } }
@keyframes victory { 50% { transform: translateY(-14px); } }
@keyframes shake { 25% { transform: translate(-5px, 2px); } 50% { transform: translate(4px, -2px); } 75% { transform: translate(-3px, 1px); } }
@keyframes popUp { 0% { opacity: 0; translate: 0 10px; scale: .6; } 15% { opacity: 1; scale: 1.15; } 100% { opacity: 0; translate: 0 -50px; scale: 1; } }

.hint { min-height: 22px; margin: 0 12px; font-size: 13px; text-align: center; color: var(--muted); }
.hint.on { color: #2f6db0; font-weight: 700; }
.hint.warn { color: var(--red); font-weight: 700; }
.pad { padding: 4px 10px calc(10px + env(safe-area-inset-bottom)); }
.pad.locked { opacity: .45; pointer-events: none; }
.turn-who { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.mv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mv { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; min-height: 58px; padding: 6px 12px;
  border: 2px solid var(--edge); border-radius: 12px; background: var(--panel); box-shadow: 0 3px 0 var(--edge); }
.mv:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.mv b { grid-row: span 2; font-size: 24px; width: 30px; text-align: center; }
.mv span { font-size: 18px; font-weight: 700; }
.mv small { font-size: 11px; color: var(--muted); }
.mv-atk b { color: var(--red); } .mv-tech b { color: #2f6db0; } .mv-guard b { color: var(--green); } .mv-charge b { color: var(--gold); }
.mv-sp { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 8px; min-height: 52px; background: #e2d6ba; color: var(--muted); box-shadow: none; }
.mv-sp .sp-n { font-size: 17px; }
.mv-sp:disabled { opacity: .8; }
.mv-sp.ready { background: var(--red); border-color: #7e2219; color: #fff; box-shadow: 0 3px 0 #7e2219; animation: ready 1s ease-in-out infinite alternate; }
.mv-sp.ready small { color: #f6d8d2; }
@keyframes ready { to { background: #d4482f; } }

.cover { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(35,28,21,.92); color: #f3e6c8; text-align: center; animation: fade .25s; }
.cover > div { width: 100%; }
.cover b { font-size: 26px; }
.cover .btn { color: var(--ink); }
.cover .btn.primary { color: #fff; }
.cover.result.win { background: rgba(35,28,21,.88); }
.res-t { display: block; font-family: Pixel12, Body; font-size: 56px !important; color: #ffcf4a; margin-bottom: 8px; }
.cover.lose .res-t { color: #c9b8a0; }

@media (min-width: 520px) { body { padding: 0; } #app { box-shadow: 0 0 40px rgba(0,0,0,.6); } }
@media (max-height: 700px) { .ftr { height: 92%; } .mv { min-height: 50px; } .hud { padding: 4px 12px; } }

.title .menu { gap: 10px; padding: 8px 16px; }
.title .btn { min-height: 50px; padding: 8px 16px; }
.card.locked::after { content: '？'; position: absolute; left: 0; right: 0; top: 18%; text-align: center; font-size: 28px; color: #fff; }

</style>

:"馬岱","war":80,"lead":74,"int":50,"cha":62,"color":"#8a7a5c","sp":"怒喝","type":"stun","look":{"hat":"helmet","weapon":"axe","beard":"none","eyes":"fierce","skin":"normal","hair":"black","age":"mid"}},{"name":"劉璋","war":30,"lead":40,"int":50,"cha":66,"color":"#8a7a5c","sp":"連斬","type":"combo","look":{"hat":"headband","weapon":"spear","beard":"mustache","eyes":"fierce","skin":"normal","hair":"black","age":"mid"}},{"name":"法正","war":50,"lead":76,"int":94,"cha":50,"color":"#8a7a5c","sp":"奇策","type":"trick","look":{"hat":"scholar","robe":true,"weapon":"fan","beard":"mustache","eyes":"sly","skin":"tan","hair":"black","age":"mid"}},{"name":"張任","war":84,"lead":84,"int":72,"cha":60,"color":"#8a7a5c","sp":"猛擊","type":"power","look":{"hat":"headband","weapon":"halberd","beard":"none","eyes":"fierce","skin":"tan","hair":"black","age":"mid"}},{"name":"黃權","war":58,"lead":74,"int":82,"cha":70,"color":"#8a7a5c","sp":"猛擊","type":"power","look":{"hat":"scholar","robe":true,"weapon":"scroll","beard":"mustache","eyes":"sly","skin":"tan","hair":"black","age":"mid"}},{"name":"李嚴","war":76,"lead":82,"int":78,"cha":56,"color":"#8a7a5c","sp":"怒喝","type":"stun","look":{"hat":"headband","weapon":"spear","beard":"none","eyes":"calm","skin":"normal","hair":"black","age":"mid"}},{"name":"嚴顏","war":82,"lead":80,"int":66,"cha":70,"color":"#8a7a5c","sp":"連斬","type":"combo","look":{"hat":"helmet","weapon":"glaive","beard":"long","eyes":"fierce","skin":"fair","hair":"white","age":"old","title":"老將"}},{"name":"王平","war":76,"lead":80,"int":70,"cha":60,"color":"#8a7a5c","sp":"怒喝","type":"stun","look":{"hat":"headband","weapon":"spear","beard":"none","eyes":"fierce","skin":"normal","hair":"black","age":"mid"}}];

<script>
/* js/core.js */
/* 單挑核心規則（不碰 DOM，可在 Node 測試）。
 * 每回合雙方同時出招：猛攻 剋 技巧、技巧 剋 架擋、架擋 剋 猛攻；蓄氣可累積氣力，但會被打個正著。
 * 氣力滿（3 格，神射 2 格）可放必殺技；必殺技無法閃避，只有架擋能減半。 */
(function (TK) {
  'use strict';

  const MOVES = {
    atk: { name: '猛攻', icon: '斬', beats: 'tech', desc: '剋技巧' },
    tech: { name: '技巧', icon: '巧', beats: 'guard', desc: '剋架擋' },
    guard: { name: '架擋', icon: '守', beats: 'atk', desc: '剋猛攻・減半必殺' },
    charge: { name: '蓄氣', icon: '氣', beats: null, desc: '氣力＋1，但毫無防備' },
  };
  const SP_TYPES = {
    power: { label: '重擊', desc: '一擊造成巨大傷害' },
    combo: { label: '連擊', desc: '連續三次攻擊' },
    stun: { label: '震懾', desc: '造成傷害，對手下回合無法行動' },
    drain: { label: '鼓舞', desc: '造成傷害並回復自身體力' },
    trick: { label: '計略', desc: '以智力造成傷害，清空對手氣力並令其停一回合' },
    arrow: { label: '神射', desc: '只需 2 格氣力即可發動' },
  };
  const MAX_EN = 3;

  // 可替換的亂數（測試時注入固定序列）
  let rnd = Math.random;
  function setRandom(fn) { rnd = fn || Math.random; }

  function cost(g) { return g.type === 'arrow' ? 2 : MAX_EN; }

  function fighter(g) {
    return { g, maxHp: 110 + Math.round(g.lead / 5), hp: 110 + Math.round(g.lead / 5), en: 0, stun: 0 };
  }

  function newMatch(ga, gb) { return { a: fighter(ga), b: fighter(gb), turn: 0, history: { a: [], b: [] }, over: null }; }

  // 基本傷害：武力決定攻擊，統率略減受到的傷害
  function baseDmg(att, def, stat) {
    const s = stat === 'int' ? att.g.int : att.g.war;
    const raw = 8 + s * 0.22;
    const guard = 1 - (def.g.lead - 50) / 500;
    return raw * guard * (0.88 + rnd() * 0.24);
  }

  function canSpecial(f) { return f.en >= cost(f.g); }

  // 結算一回合。回傳 events（依序播放）：{type:'hit'|'heal'|'stun'|'clash'|'charge'|'idle'|'special', who, to, dmg, ...}
  function resolve(m, moveA, moveB) {
    if (m.over) return [];
    m.turn++;
    const F = { a: m.a, b: m.b };
    const mv = { a: moveA, b: moveB };
    // 被震懾的一方本回合不能行動
    for (const k of ['a', 'b']) {
      if (F[k].stun > 0) { mv[k] = 'stunned'; F[k].stun--; }
      else if (mv[k] === 'special' && !canSpecial(F[k])) mv[k] = 'atk';
      if (mv[k] !== 'stunned') m.history[k].push(mv[k]);
    }
    const ev = [];
    const other = (k) => (k === 'a' ? 'b' : 'a');
    const hit = (from, mult, extra) => {
      const to = other(from);
      const dmg = Math.max(1, Math.round(baseDmg(F[from], F[to], extra && extra.stat) * mult));
      F[to].hp = Math.max(0, F[to].hp - dmg);
      ev.push(Object.assign({ type: 'hit', who: from, to, dmg }, extra || {}));
      return dmg;
    };
    const gain = (k, n) => { F[k].en = Math.min(MAX_EN, F[k].en + n); };

    // 必殺技
    const special = (k) => {
      const f = F[k], o = other(k), sp = f.g.type;
      f.en -= cost(f.g);
      const guarded = mv[o] === 'guard';
      const red = guarded ? 0.5 : 1;
      ev.push({ type: 'special', who: k, name: f.g.sp, sp, guarded });
      if (sp === 'combo') { for (let i = 0; i < 3; i++) hit(k, 0.95 * red, { sp: true, n: i }); }
      else if (sp === 'power') hit(k, 2.4 * red, { sp: true, big: true });
      else if (sp === 'arrow') hit(k, 2.0 * red, { sp: true, big: true });
      else if (sp === 'stun') { hit(k, 1.5 * red, { sp: true }); if (!guarded) { F[o].stun = 1; ev.push({ type: 'stun', to: o }); } }
      else if (sp === 'drain') {
        const d = hit(k, 1.6 * red, { sp: true });
        const heal = Math.round(d * 0.6);
        f.hp = Math.min(f.maxHp, f.hp + heal);
        ev.push({ type: 'heal', to: k, amount: heal });
      } else if (sp === 'trick') {
        hit(k, 1.7 * red, { sp: true, stat: 'int' });
        F[o].en = 0;
        if (!guarded) { F[o].stun = 1; ev.push({ type: 'stun', to: o }); }
      }
    };

    const spA = mv.a === 'special', spB = mv.b === 'special';
    if (spA || spB) {
      if (spA) special('a');
      if (spB) special('b');
      // 對方出一般招式仍照常判定（必殺技者不受一般招式影響外的傷害）
      for (const k of ['a', 'b']) {
        const o = other(k);
        if (mv[k] === 'special' || mv[o] !== 'special') continue;
        if (mv[k] === 'atk' || mv[k] === 'tech') { hit(k, 0.6); }
        else if (mv[k] === 'charge') { gain(k, 1); ev.push({ type: 'charge', who: k }); }
      }
    } else {
      const A = mv.a, B = mv.b;
      const isAtk = (x) => x === 'atk' || x === 'tech';
      const open = (x) => x === 'charge' || x === 'stunned';
      if (A === B) {
        if (A === 'atk') { ev.push({ type: 'clash' }); hit('a', 0.5); hit('b', 0.5); }
        else if (A === 'tech') { ev.push({ type: 'clash' }); hit('a', 0.4); hit('b', 0.4); }
        else if (A === 'guard') ev.push({ type: 'idle', text: '雙方互相牽制' });
        else if (A === 'charge') { gain('a', 1); gain('b', 1); ev.push({ type: 'charge', who: 'a' }, { type: 'charge', who: 'b' }); }
        else ev.push({ type: 'idle', text: '雙方都動彈不得' });
      } else {
        for (const k of ['a', 'b']) {
          const me = mv[k], o = other(k), you = mv[o];
          if (me === 'charge') { gain(k, 1); ev.push({ type: 'charge', who: k }); }
          if (isAtk(me) && open(you)) { hit(k, 1.2, { open: true }); gain(k, 1); }
          else if (isAtk(me) && MOVES[me].beats === you) { hit(k, 1.0, { win: true }); gain(k, 1); }
          else if (me === 'guard' && you === 'atk') { hit(k, 0.8, { counter: true }); gain(k, 1); }
        }
        if (!ev.some((e) => e.type === 'hit') && !ev.some((e) => e.type === 'charge')) ev.push({ type: 'idle', text: '攻勢被化解' });
      }
    }
    if (m.a.hp <= 0 || m.b.hp <= 0) {
      m.over = m.a.hp <= 0 && m.b.hp <= 0 ? (m.a.hp >= m.b.hp ? 'a' : 'b') : (m.a.hp > 0 ? 'a' : 'b');
    }
    return { moves: mv, events: ev };
  }

  // 電腦出招：依個性、氣力與玩家習慣判斷；level 1–10 越高越會讀招
  function aiMove(m, me, level) {
    const F = m[me], O = m[me === 'a' ? 'b' : 'a'];
    const hist = m.history[me === 'a' ? 'b' : 'a'];
    if (F.stun > 0) return 'guard';
    if (canSpecial(F) && rnd() < 0.8) return 'special';
    // 對手氣力滿：多半架擋
    if (canSpecial(O) && rnd() < 0.3 + level * 0.04) return 'guard';
    // 對手被震懾：放心蓄氣或猛攻
    if (O.stun > 0) return F.en < cost(F.g) - 1 ? 'charge' : 'atk';
    // 讀招：找出玩家最近最常出的招，出剋制它的招
    if (hist.length >= 2 && rnd() < 0.12 + level * 0.05) {
      const recent = hist.slice(-4).filter((x) => x !== 'special');
      const cnt = {};
      recent.forEach((x) => { cnt[x] = (cnt[x] || 0) + 1; });
      const fav = Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x])[0];
      if (fav === 'charge') return 'atk';
      const counter = Object.keys(MOVES).find((k) => MOVES[k].beats === fav);
      if (counter) return counter;
    }
    const w = {
      atk: 0.6 + F.g.war / 150,
      tech: 0.5 + F.g.int / 160,
      guard: 0.55 + F.g.lead / 220,
      charge: F.en < cost(F.g) ? 0.35 + (F.hp / F.maxHp) * 0.2 : 0,
    };
    let total = 0;
    for (const k in w) total += w[k];
    let r = rnd() * total;
    for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return 'atk';
  }

  // 看穿：智力高於對手越多，越常看出對手下一招（偶爾會看錯）
  function readChance(me, foe) { return Math.max(0.08, Math.min(0.7, 0.25 + (me.int - foe.int) / 140)); }
  function hint(m, me, foeMove) {
    const F = m[me], O = m[me === 'a' ? 'b' : 'a'];
    if (rnd() >= readChance(F.g, O.g)) return null;
    if (rnd() < 0.85) return foeMove;
    const keys = Object.keys(MOVES).filter((k) => k !== foeMove);
    return keys[Math.floor(rnd() * keys.length)];
  }

  // 過關路線：10 戰，由弱到強，最後一戰為最強者（通常是呂布）
  function power(g) { return g.war * 0.75 + g.lead * 0.25; }
  function ladder(roster, playerName) {
    const pool = roster.filter((g) => g.name !== playerName && g.war >= 55).sort((x, y) => power(x) - power(y));
    const boss = pool.pop();
    const tiers = [[0, 0.3], [0.2, 0.45], [0.35, 0.55], [0.45, 0.65], [0.55, 0.72], [0.65, 0.8], [0.72, 0.88], [0.8, 0.95], [0.88, 1]];
    const used = new Set();
    const out = tiers.map(([lo, hi]) => {
      const a = Math.floor(pool.length * lo), b = Math.max(a + 1, Math.floor(pool.length * hi));
      const cand = pool.slice(a, b).filter((g) => !used.has(g.name));
      const pick = cand[Math.floor(rnd() * cand.length)] || pool.find((g) => !used.has(g.name));
      used.add(pick.name);
      return pick;
    });
    out.push(boss);
    return out;
  }

  function ranking(roster, key) { return roster.slice().sort((x, y) => y[key || 'war'] - x[key || 'war'] || y.lead - x.lead); }

  TK.Duel = { MOVES, SP_TYPES, MAX_EN, cost, setRandom, fighter, newMatch, resolve, aiMove, hint, readChance, ladder, ranking, canSpecial };
})(globalThis.TK = globalThis.TK || {});

</script>
<script>
/* js/anime.js */
/* 原創動畫風（賽璐璐）武將半身像產生器（與 Godot 版 tools/anime_portrait.js 相同）。依外觀特徵組合 SVG。 */
// viewBox 0 0 200 250；mode 'head' 時裁切臉部。
(function (TK) {
  'use strict';

const INK = '#2b2233';
const SKIN = {
  normal: ['#ffd9b8', '#f0b48e'], fair: ['#ffe4cc', '#f2c1a0'], tan: ['#e9b07e', '#c98a5a'],
  red: ['#d9533f', '#a9382a'], dark: ['#b37a4f', '#8a5a36'],
};
const HAIR = {
  black: ['#2a2838', '#4a5070', '#151320'], brown: ['#5a3a28', '#8a6040', '#3a2418'],
  grey: ['#8a8c96', '#b8bac4', '#5a5c66'], white: ['#e8e8ee', '#ffffff', '#b8b8c4'],
};

function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb(a) { return '#' + a.map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function shade(c, k) { return rgb(hex(c).map((v) => (k < 0 ? v * (1 + k) : v + (255 - v) * k))); }
function mix(a, b, k) { const A = hex(a), B = hex(b); return rgb(A.map((v, i) => v * (1 - k) + B[i] * k)); }

function nameHash(s) {
  let h = 2166136261;
  for (const ch of s) h = Math.imul(h ^ ch.codePointAt(0), 16777619) >>> 0;
  return h;
}

function svg(g, color, mode, t) {
  const hv = nameHash(g.name);
  const fringeStyle = t.fringe || ['spiky', 'part', 'swept'][(hv >>> 11) % 3];
  const square = t.jaw ? t.jaw === 'square' : (t.eyes === 'fierce' && t.age !== 'young' && (hv >>> 13) % 2 === 0);
  const [skin, skinS] = SKIN[t.skin] || SKIN.normal;
  const [hair, hairHi, hairS] = HAIR[t.hair] || HAIR.black;
  const cloth = t.armor ? '#e8ecf2' : color;
  const clothS = shade(cloth, -0.32), clothL = shade(cloth, 0.25);
  const O = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  const o = `stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
  const eyeC = t.eyeColor || (t.skin === 'red' ? '#3a2418' : '#4a2e1c');
  const old = t.age === 'old', young = t.age === 'young';
  const p = [];

  // 背景
  p.push(`<defs><radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#eef2f8"/><stop offset="1" stop-color="#b9c6d8"/></radialGradient></defs>`);
  // t.noBg：去背（單挑畫面用）
  if (!t.noBg) p.push(`<rect width="200" height="250" fill="url(#bg)"/>`);
  if (!t.noBg) p.push(`<circle cx="100" cy="118" r="86" fill="${mix(color, '#ffffff', 0.55)}" opacity=".55"/>`);

  // 長兵器（身後）
  const steel = '#e9eef4', steelS = '#a9b4c2', wood = '#8a5a33';
  const shaft = (y1) => `<path d="M168,252 L168,${y1}" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M168,252 L168,${y1}" stroke="${wood}" stroke-width="5" stroke-linecap="round"/>`;
  const blade = (d) => `<path d="${d}" fill="${steel}" ${o}/>`;
  switch (t.weapon) {
    case 'spear': p.push(shaft(30), blade('M168,0 L177,32 L159,32 Z'), `<path d="M160,34 Q168,52 176,34 Z" fill="#e0453a" ${o}/>`); break;

<script>
/* js/sound.js */
/* 晶片音樂風音效：以方波、三角波與雜訊即時合成（無外部音檔，旋律為原創）。 */
(function (TK) {
  'use strict';
  let ctx = null;
  let muted = false;
  try { muted = localStorage.getItem('qunxiong.mute') === '1'; } catch (e) { /* 無法存取時用預設值 */ }

  function ac() {
    if (muted) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }

  function tone(freq, dur, type, vol, delay, slideTo) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.setValueAtTime(vol || 0.05, t + dur * 0.8);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function noise(dur, vol, delay, hp) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + (delay || 0);
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    // 低解析度雜訊，模仿早期音源
    let v = 0;
    for (let i = 0; i < len; i++) { if (i % 8 === 0) v = Math.random() * 2 - 1; d[i] = v * (1 - i / len); }
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp || 900;
    g.gain.value = vol || 0.12;
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
  }

  // 音名轉頻率
  const N = (n) => 440 * Math.pow(2, (n - 69) / 12);
  function seq(notes, step, type, vol, delay) {
    notes.forEach((n, i) => { if (n) tone(N(n), step * 0.9, type, vol, (delay || 0) + i * step); });
  }

  const S = {
    cursor() { tone(1320, 0.025, 'square', 0.025); },
    ok() { tone(988, 0.05, 'square', 0.04); tone(1319, 0.07, 'square', 0.04, 0.05); },
    cancel() { tone(784, 0.05, 'square', 0.035); tone(523, 0.07, 'square', 0.035, 0.05); },
    error() { tone(147, 0.18, 'square', 0.05); },
    type() { tone(1760, 0.012, 'square', 0.012); },
    drum(delay) { noise(0.09, 0.16, delay || 0, 0); tone(110, 0.08, 'triangle', 0.15, delay || 0, 55); },
    clash() { noise(0.08, 0.1, 0, 2500); tone(1500, 0.05, 'square', 0.02); },
    volley() { for (let i = 0; i < 5; i++) noise(0.04, 0.06, i * 0.05, 3000); },
    // 換月：簡短上行琶音
    month() { seq([72, 76, 79, 84], 0.09, 'square', 0.035); seq([48, 0, 55, 0], 0.09, 'triangle', 0.08); },
    // 出陣：戰鼓與號角
    march() { [0, 0.16, 0.32, 0.4].forEach((d) => S.drum(d)); seq([67, 0, 67, 72, 0, 74, 76], 0.1, 'square', 0.035, 0.5); },
    win() { seq([72, 76, 79, 84, 0, 79, 84], 0.11, 'square', 0.04); seq([48, 0, 55, 0, 60, 0, 60], 0.11, 'triangle', 0.09); },
    lose() { seq([69, 0, 65, 0, 62, 0, 57], 0.16, 'square', 0.035); seq([45, 0, 41, 0, 38, 0, 33], 0.16, 'triangle', 0.08); },
    title() { seq([62, 0, 69, 67, 69, 0, 74, 72, 69, 0, 67, 69], 0.15, 'square', 0.03); seq([38, 0, 0, 0, 45, 0, 0, 0, 43, 0, 0, 0], 0.15, 'triangle', 0.08); },
    event() { seq([79, 0, 76, 79, 84], 0.1, 'square', 0.03); },
    isMuted() { return muted; },
    toggle() {
      muted = !muted;
      try { localStorage.setItem('qunxiong.mute', muted ? '1' : '0'); } catch (e) { /* 忽略 */ }
      if (!muted) S.ok();
      return muted;
    },
  };
  TK.Sound = S;
})(globalThis.TK = globalThis.TK || {});

</script>
<script>
/* js/ui.js */
/* 三國一騎討：畫面與操作（手機直向優先，全部可用點按操作）。 */
(function (TK) {
  'use strict';
  const D = TK.Duel, R = TK.ROSTER, SND = TK.Sound;
  const app = document.getElementById('app');
  const byName = Object.fromEntries(R.map((g) => [g.name, g]));
  const RANK = Object.fromEntries(D.ranking(R).map((g, i) => [g.name, i + 1]));
  const START = ['關羽', '張飛', '趙雲', '夏侯惇', '孫策', '太史慈', '黃忠', '諸葛亮'];
  const STAGES = 10;

  // ---------- 小工具 ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms * speed));
  let speed = 1;
  const imgCache = new Map();
  // mode：'head' 頭像、'full' 半身、'cut' 去背半身（戰鬥與對峙畫面）
  function portraitURL(g, mode) {
    const key = g.name + mode;
    const look = mode === 'cut' ? Object.assign({}, g.look, { noBg: true }) : g.look;
    if (!imgCache.has(key)) imgCache.set(key, 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(TK.Anime.svg(g, g.color, mode === 'cut' ? 'full' : mode, look)));
    return imgCache.get(key);
  }
  const face = (g, mode, cls) => h('img', { class: 'pt ' + (cls || ''), src: portraitURL(g, mode || 'head'), alt: g.name, draggable: 'false' });
  function btn(label, on, cls, sub) {
    return h('button', { class: 'btn ' + (cls || ''), onclick: (e) => { SND.ok(); on(e); } }, h('span', {}, label), sub ? h('small', {}, sub) : null);
  }
  function screen(cls, ...kids) { app.replaceChildren(h('div', { class: 'screen ' + cls }, ...kids)); window.scrollTo(0, 0); }

  // ---------- 存檔 ----------
  const KEY = 'yiqitao.save.v1';
  function load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { s = null; }
    s = s || {};
    s.unlocked = Array.isArray(s.unlocked) ? s.unlocked.filter((n) => byName[n]) : [];
    START.forEach((n) => { if (!s.unlocked.includes(n)) s.unlocked.push(n); });
    s.cleared = s.cleared || {};
    return s;
  }
  let save = load();
  function store() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* 無法存檔時照常遊玩 */ } }
  const unlocked = (g) => save.unlocked.includes(g.name);

  // ---------- 標題 ----------
  function title() {
    const a = byName['關羽'], b = byName['呂布'];
    screen('title',
      h('div', { class: 'logo' }, h('div', { class: 'logo-sub' }, '三國'), h('div', { class: 'logo-main' }, '一騎討')),
      h('div', { class: 'title-vs' }, face(a, 'cut', 'tl'), h('div', { class: 'tvs' }, '對'), face(b, 'cut', 'tr')),
      h('div', { class: 'menu' },
        btn('過關挑戰', () => pick('arcade'), 'primary', '連破十將，最後迎戰天下第一'),
        btn('雙人對戰', () => pick('vs'), '', '同一支手機，兩人輪流出招'),
        btn('武將排名', () => gallery(), '', '100 位武將的武力排行與必殺技'),
        btn('玩法說明', () => help(), '')),
      h('div', { class: 'foot' },
        h('button', { class: 'chip', onclick: (e) => { const m = SND.toggle(); e.currentTarget.textContent = m ? '音效：關' : '音效：開'; } }, SND.isMuted() ? '音效：關' : '音效：開'),
        h('span', {}, `已解鎖 ${save.unlocked.length}／${R.length}`)));
  }

  function help() {
    const M = D.MOVES;
    screen('help',
      header('玩法說明', title),
      h('div', { class: 'paper' },
        h('p', {}, '每回合雙方同時出招，三招互相剋制：'),
        h('div', { class: 'rps' }, ...['atk', 'tech', 'guard'].map((k) => h('div', { class: 'rps-i' }, h('b', {}, M[k].icon), M[k].name, h('small', {}, M[k].desc)))),
        h('ul', {},
          h('li', {}, '猛攻 剋 技巧、技巧 剋 架擋、架擋 剋 猛攻（反擊）。同招互拚則兩敗俱傷。'),
          h('li', {}, '蓄氣：氣力＋1，但這回合毫無防備，被打會受到加重傷害。'),
          h('li', {}, '出招命中也會累積氣力。氣力集滿 3 格（黃忠只要 2 格）可發動必殺技。'),
          h('li', {}, '必殺技無法閃避，只有「架擋」能把傷害減半。看到對手氣力滿了，要小心！'),
          h('li', {}, '武力決定攻擊力，統率決定體力與防禦，智力越高越容易「看穿」對手的下一招。'),
          h('li', {}, '過關挑戰中擊敗的武將會解鎖，之後可以選用。'))),
      h('div', { class: 'menu' }, btn('返回', title)));
  }

  function header(text, back, extra) {
    return h('div', { class: 'bar' }, h('button', { class: 'back', onclick: () => { SND.cancel(); back(); } }, '‹'), h('div', { class: 'bar-t' }, text), extra || h('span'));
  }

  // ---------- 武將排名 ----------
  function gallery(sortKey) {
    sortKey = sortKey || 'war';
    const list = D.ranking(R, sortKey);
    const tabs = h('div', { class: 'tabs' }, ...[['war', '武力'], ['lead', '統率'], ['int', '智力']].map(([k, l]) =>
      h('button', { class: 'tab' + (k === sortKey ? ' on' : ''), onclick: () => { SND.cursor(); gallery(k); } }, l)));
    screen('gallery', header('武將排名', title), tabs,
      h('div', { class: 'rank-list' }, ...list.map((g, i) => h('div', { class: 'rank-row' + (i < 10 ? ' top' : ''), onclick: () => detail(g, null) },
        h('div', { class: 'rk' }, i + 1), face(g, 'head'),
        h('div', { class: 'rk-n' }, h('b', {}, g.name, unlocked(g) ? null : h('i', { class: 'lock' }, '未解鎖')), h('small', {}, `${g.sp}・${D.SP_TYPES[g.type].label}`)),
        h('div', { class: 'rk-s' }, statCell('武', g.war, sortKey === 'war'), statCell('統', g.lead, sortKey === 'lead'), statCell('智', g.int, sortKey === 'int'))))));
  }
  const statCell = (l, v, on) => h('div', { class: 'sc' + (on ? ' on' : '') }, h('small', {}, l), v);

  // 武將詳情（底部彈出）
  function detail(g, onPick, pickLabel) {
    SND.cursor();
    const close = () => sheet.remove();
    const sp = D.SP_TYPES[g.type];
    const bar = (l, v, c) => h('div', { class: 'stat' }, h('span', {}, l), h('div', { class: 'track' }, h('div', { style: `width:${v}%;background:${c}` })), h('b', {}, v));
    const can = unlocked(g);
    const sheet = h('div', { class: 'sheet-wrap', onclick: (e) => { if (e.target === sheet) close(); } },
      h('div', { class: 'sheet' },
        h('div', { class: 'sh-top' },
          h('div', { class: 'sh-pt', style: `--c:${g.color}` }, face(g, 'full')),
          h('div', { class: 'sh-info' },
            h('div', { class: 'sh-rank' }, `武力第 ${RANK[g.name]} 名`),
            h('div', { class: 'sh-name' }, g.name, g.look.title ? h('small', {}, g.look.title) : null),
            bar('武力', g.war, '#c0392b'), bar('統率', g.lead, '#2f6db0'), bar('智力', g.int, '#7b4fb0'),
            h('div', { class: 'sh-sp' }, h('b', {}, `必殺・${g.sp}`), h('small', {}, `${sp.label}：${sp.desc}`)))),
        h('div', { class: 'sh-btns' },
          btn('關閉', close, 'ghost'),
          onPick ? (can ? btn(pickLabel || '出陣', () => { close(); onPick(g); }, 'primary') : h('div', { class: 'locked-note' }, '在過關挑戰中擊敗他即可解鎖')) : null)));
    app.append(sheet);
  }

  // ---------- 選將 ----------
  function pick(mode, p1) {
    const title2 = mode === 'arcade' ? '選擇武將' : (p1 ? '玩家二 選擇武將' : '玩家一 選擇武將');
    const list = D.ranking(R);
    const cards = list.map((g) => {
      const can = unlocked(g);
      return h('div', { class: 'card' + (can ? '' : ' locked') + (p1 && p1.name === g.name ? ' taken' : ''), style: `--c:${g.color}`,
        onclick: () => detail(g, (sel) => {
          if (mode === 'arcade') arcadeStart(sel);
          else if (!p1) pick('vs', sel);
          else versus({ mode: 'vs', p1, p2: sel });
        }, mode === 'arcade' ? '出陣' : '決定') },
      face(g, 'head'), h('div', { class: 'cn' }, can ? g.name : '？？'), h('div', { class: 'cw' }, `武${g.war}`));
    });
    screen('pick', header(title2, p1 ? () => pick('vs') : title, h('span', { class: 'bar-r' }, `${save.unlocked.length}/${R.length}`)),
      h('div', { class: 'grid' }, ...cards));
  }

  // ---------- 過關 ----------
  let run = null;
  function arcadeStart(g) {
    run = { player: g, stage: 0, ladder: D.ladder(R, g.name) };
    ladderView();
  }
  function ladderView() {
    const { player, stage, ladder } = run;
    screen('ladder', header('過關挑戰', title),
      h('div', { class: 'ld-me' }, face(player, 'head'), h('div', {}, h('b', {}, player.name), h('small', {}, `必殺・${player.sp}`))),
      h('div', { class: 'ld-list' }, ...ladder.map((g, i) => h('div', { class: 'ld-row' + (i < stage ? ' done' : i === stage ? ' now' : '') },
        h('div', { class: 'ld-no' }, i === STAGES - 1 ? '終' : i + 1),
        i <= stage ? face(g, 'head') : h('div', { class: 'pt q' }, '？'),
        h('div', { class: 'ld-n' }, i <= stage ? g.name : '？？？', i <= stage ? h('small', {}, `武${g.war}`) : null),
        h('div', { class: 'ld-st' }, i < stage ? '勝' : i === stage ? '下一戰' : '')))),
      h('div', { class: 'menu' }, btn(`第 ${stage + 1} 戰・開戰`, () => versus({ mode: 'arcade', p1: player, p2: ladder[stage], stage }), 'primary')));
  }

  // ---------- 對戰前的對峙畫面 ----------
  async function versus(ctx) {
    screen('versus',
      h('div', { class: 'vs-side top', style: `--c:${ctx.p2.color}` }, face(ctx.p2, 'cut'), h('div', { class: 'vs-name' }, ctx.p2.name, h('small', {}, ctx.mode === 'vs' ? '玩家二' : `武${ctx.p2.war}`))),
      h('div', { class: 'vs-mid' }, ctx.mode === 'arcade' ? (ctx.stage === STAGES - 1 ? '最終戰' : `第 ${ctx.stage + 1} 戰`) : '對戰', h('b', {}, '一騎討')),
      h('div', { class: 'vs-side bot', style: `--c:${ctx.p1.color}` }, face(ctx.p1, 'cut'), h('div', { class: 'vs-name' }, ctx.p1.name, h('small', {}, ctx.mode === 'vs' ? '玩家一' : '你'))));
    SND.march();
    await wait(1600);
    fight(ctx);
  }

  // ---------- 戰鬥 ----------
  function fight(ctx) {
    const m = D.newMatch(ctx.p1, ctx.p2);
    const level = ctx.mode === 'arcade' ? ctx.stage + 1 : 0;
    const two = ctx.mode === 'vs';
    const hud = (k, g) => {
      const hp = h('div', { class: 'hp-fill', style: `background:${g.color}` });
      const hpTxt = h('span', { class: 'hp-t' });
      const pips = h('div', { class: 'pips' }, ...Array.from({ length: D.MAX_EN }, (_, i) => h('i', { class: i >= D.cost(g) ? 'x' : '' })));
      const st = h('span', { class: 'st' });
      const el = h('div', { class: 'hud ' + k },
        h('div', { class: 'hud-n' }, h('b', {}, g.name), h('small', {}, two ? (k === 'a' ? '玩家一' : '玩家二') : (k === 'a' ? '你' : `武${g.war}`)), st),
        h('div', { class: 'hp' }, hp, hpTxt), pips);
      return { el, hp, hpTxt, pips, st };
    };
    const H = { a: hud('a', ctx.p1), b: hud('b', ctx.p2) };
    const mk = (k, g) => {
      const body = h('div', { class: 'body' }, face(g, 'cut'));
      const bubble = h('div', { class: 'bubble' });
      const root = h('div', { class: 'ftr ' + k, style: `--c:${g.color}` }, bubble, body, h('div', { class: 'shadow' }));
      return { root, body, bubble };
    };
    const FT = { a: mk('a', ctx.p1), b: mk('b', ctx.p2) };
    const fx = h('div', { class: 'fx' });
    const banner = h('div', { class: 'banner hidden' });
    const arena = h('div', { class: 'arena' }, FT.b.root, FT.a.root, fx, banner);
    const hintEl = h('div', { class: 'hint' });
    const turnEl = h('div', { class: 'turn-who' });
    const moveBtns = {};
    for (const k of ['atk', 'tech', 'guard', 'charge']) {
      const M = D.MOVES[k];
      moveBtns[k] = h('button', { class: 'mv mv-' + k, onclick: () => choose(k) }, h('b', {}, M.icon), h('span', {}, M.name), h('small', {}, M.desc));
    }
    moveBtns.special = h('button', { class: 'mv mv-sp', onclick: () => choose('special') }, h('span', { class: 'sp-n' }), h('small', { class: 'sp-d' }));
    const pad = h('div', { class: 'pad' }, turnEl, h('div', { class: 'mv-grid' }, moveBtns.atk, moveBtns.tech, moveBtns.guard, moveBtns.charge), moveBtns.special);
    const skip = h('button', { class: 'chip ff', onclick: () => { speed = speed === 1 ? 0.45 : 1; skip.textContent = speed === 1 ? '▶▶ 快轉' : '▶ 正常'; } }, speed === 1 ? '▶▶ 快轉' : '▶ 正常');
    const quit = h('button', { class: 'chip', onclick: () => { if (confirm('放棄這場對戰？')) title(); } }, '離開');
    screen('fight' + (two ? ' two' : ''),
      h('div', { class: 'fbar' }, quit, h('div', { class: 'fbar-t' }, two ? '雙人對戰' : (ctx.stage === STAGES - 1 ? '最終戰' : `第 ${ctx.stage + 1}／${STAGES} 戰`)), skip),
      H.b.el, arena, H.a.el, hintEl, pad);

    let shownHp = { a: m.a.hp, b: m.b.hp };
    function drawHud(k) {
      const f = m[k], hd = H[k];
      hd.hp.style.width = (100 * shownHp[k] / f.maxHp) + '%';
      hd.hpTxt.textContent = `${shownHp[k]}／${f.maxHp}`;
      [...hd.pips.children].forEach((p, i) => p.classList.toggle('on', i < f.en));
      hd.el.classList.toggle('full', D.canSpecial(f));
      hd.st.textContent = f.stun > 0 ? '暈眩' : '';
    }
    const drawAll = () => { drawHud('a'); drawHud('b'); };

    let side = 'a';          // 雙人模式：目前出招者
    let pending = {};         // 已決定的招式
    let foeMove = null;
    let busy = false;
    function setPad(k) {
      const f = m[k];
      const g = f.g;
      moveBtns.special.querySelector('.sp-n').textContent = `必殺・${g.sp}`;
      moveBtns.special.querySelector('.sp-d').textContent = D.canSpecial(f) ? `${D.SP_TYPES[g.type].label}：${D.SP_TYPES[g.type].desc}` : `氣力 ${f.en}／${D.cost(g)}`;
      moveBtns.special.disabled = !D.canSpecial(f);
      moveBtns.special.classList.toggle('ready', D.canSpecial(f));
      pad.style.setProperty('--c', g.color);
      turnEl.textContent = two ? `${k === 'a' ? '玩家一' : '玩家二'}（${g.name}）請出招` : '請選擇招式';
      if (f.stun > 0) turnEl.textContent = `${g.name} 暈眩中，本回合無法行動`;
    }
    function startTurn() {
      busy = false;
      pending = {};
      side = 'a';
      pad.classList.remove('locked');
      hintEl.textContent = '';
      hintEl.className = 'hint';
      if (!two) {
        foeMove = D.aiMove(m, 'b', level);
        const hm = m.a.stun > 0 ? null : D.hint(m, 'a', foeMove === 'special' ? 'special' : foeMove);
        if (hm) {
          hintEl.textContent = hm === 'special' ? `看穿！${m.b.g.name}正在凝聚氣勢，準備發動必殺技` : `看穿！${m.b.g.name}似乎想「${D.MOVES[hm].name}」`;
          hintEl.className = 'hint on';
        } else if (D.canSpecial(m.b)) {
          hintEl.textContent = `${m.b.g.name}氣力已滿，小心必殺技！`;
          hintEl.className = 'hint warn';
        }
      }
      setPad('a');
      if (m.a.stun > 0) { setTimeout(() => choose('atk'), 700); }
    }
    function choose(k) {
      if (busy) return;
      SND.cursor();
      if (!two) { busy = true; play(k, foeMove); return; }
      pending[side] = k;
      if (side === 'a') {
        busy = true;
        // 換手：蓋住畫面，讓玩家二看不到玩家一出了什麼
        const cover = h('div', { class: 'cover' }, h('div', {}, h('b', {}, '玩家一已出招'), h('p', {}, '請把手機交給玩家二'),
          btn('玩家二 準備好了', () => { cover.remove(); side = 'b'; busy = false; setPad('b'); if (m.b.stun > 0) setTimeout(() => choose('atk'), 600); }, 'primary')));
        app.append(cover);
      } else { busy = true; play(pending.a, pending.b); }
    }

    async function play(ma, mb) {
      pad.classList.add('locked');
      const before = { a: m.a.hp, b: m.b.hp };
      const r = D.resolve(m, ma, mb);
      shownHp = before;
      // 1. 亮招
      for (const k of ['a', 'b']) {
        const mv = r.moves[k];
        const txt = mv === 'special' ? '必殺' : mv === 'stunned' ? '暈眩' : D.MOVES[mv].name;
        FT[k].bubble.textContent = txt;
        FT[k].bubble.className = 'bubble show mv-' + mv;
      }
      hintEl.textContent = ''; hintEl.className = 'hint';
      await wait(650);
      // 2. 依序播放事件
      for (const e of r.events) await playEvent(e);
      FT.a.bubble.className = 'bubble'; FT.b.bubble.className = 'bubble';
      shownHp = { a: m.a.hp, b: m.b.hp };
      drawAll();
      if (m.over) { await ending(m.over); return; }
      await wait(250);
      startTurn();
    }
    function pop(k, text, cls) {
      const p = h('div', { class: 'pop ' + (cls || '') + ' at-' + k }, text);
      fx.append(p);
      setTimeout(() => p.remove(), 1000);
    }
    function anim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
    async function playEvent(e) {
      if (e.type === 'special') {
        const g = m[e.who].g;
        banner.replaceChildren(h('small', {}, `${g.name}・必殺`), h('b', {}, g.sp));
        banner.style.setProperty('--c', g.color);
        banner.className = 'banner show ' + e.who;
        arena.classList.add('flash');
        SND.march();
        await wait(1000);
        banner.className = 'banner hidden';
        arena.classList.remove('flash');
        if (e.guarded) { pop(e.who === 'a' ? 'b' : 'a', '架擋！傷害減半', 'info'); await wait(400); }
      } else if (e.type === 'hit') {
        anim(FT[e.who].body, 'lunge');
        await wait(e.sp && e.n != null ? 140 : 200);
        anim(FT[e.to].body, e.big ? 'hit-big' : 'hit');
        shownHp[e.to] = Math.max(0, shownHp[e.to] - e.dmg);
        drawHud(e.to);
        const label = e.counter ? `反擊 -${e.dmg}` : e.open ? `破綻 -${e.dmg}` : `-${e.dmg}`;
        pop(e.to, label, e.big ? 'big' : e.sp ? 'sp' : '');
        SND.clash(); if (e.big) setTimeout(SND.clash, 80);
        if (e.big) anim(arena, 'shake');
        await wait(e.sp && e.n != null ? 300 : 520);
      } else if (e.type === 'clash') {
        anim(FT.a.body, 'lunge'); anim(FT.b.body, 'lunge');
        await wait(180);
        pop('mid', '交鋒！', 'info'); SND.clash(); setTimeout(SND.clash, 90);
        await wait(250);
      } else if (e.type === 'charge') {
        anim(FT[e.who].body, 'aura');
        m[e.who] && drawHud(e.who);
        pop(e.who, '氣力＋1', 'charge'); SND.ok();
        await wait(420);
      } else if (e.type === 'heal') {
        shownHp[e.to] = Math.min(m[e.to].maxHp, shownHp[e.to] + e.amount);
        drawHud(e.to);
        pop(e.to, `+${e.amount}`, 'heal'); SND.event();
        await wait(450);
      } else if (e.type === 'stun') {
        pop(e.to, '暈眩！', 'info');
        await wait(420);
      } else if (e.type === 'idle') {
        pop('mid', e.text, 'info');
        await wait(560);
      }
    }

    async function ending(winner) {
      const loser = winner === 'a' ? 'b' : 'a';
      FT[loser].root.classList.add('down');
      FT[winner].root.classList.add('victor');
      const wg = m[winner].g;
      banner.replaceChildren(h('b', {}, `${wg.name} 勝！`));
      banner.style.setProperty('--c', wg.color);
      banner.className = 'banner show end';
      const won = winner === 'a';
      if (two || won) SND.win(); else SND.lose();
      await wait(1500);
      result(won);
    }
    function result(won) {
      let title2, msg = [], btns = [];
      if (two) {
        title2 = `${m[won ? 'a' : 'b'].g.name} 獲勝`;
        msg.push(won ? '玩家一勝利！' : '玩家二勝利！');
        btns = [btn('再戰一場', () => versus(ctx), 'primary'), btn('重新選將', () => pick('vs')), btn('回標題', title, 'ghost')];
      } else if (won) {
        const foe = ctx.p2;
        if (!save.unlocked.includes(foe.name)) { save.unlocked.push(foe.name); msg.push(`解鎖新武將：${foe.name}`); }
        const best = Math.max(save.cleared[ctx.p1.name] || 0, ctx.stage + 1);
        save.cleared[ctx.p1.name] = best;
        store();
        if (ctx.stage === STAGES - 1) {
          title2 = '天下無敵';
          msg.unshift(`${ctx.p1.name} 連破十將，威震天下！`);
          btns = [btn('再挑戰一次', () => arcadeStart(ctx.p1), 'primary'), btn('換武將', () => pick('arcade')), btn('回標題', title, 'ghost')];
        } else {
          title2 = '勝利';
          msg.unshift(`擊敗了${foe.name}！`);
          run.stage = ctx.stage + 1;
          btns = [btn('下一戰', () => ladderView(), 'primary'), btn('回標題', title, 'ghost')];
        }
      } else {
        title2 = '敗北';
        msg.push(`敗給了${ctx.p2.name}……`, '換個出招節奏再試一次吧。');
        btns = [btn('再戰', () => versus(ctx), 'primary'), btn('回到路線', () => ladderView()), btn('回標題', title, 'ghost')];
      }
      app.append(h('div', { class: 'cover result ' + (won || two ? 'win' : 'lose') },
        h('div', {}, h('b', { class: 'res-t' }, title2), ...msg.map((t) => h('p', {}, t)), h('div', { class: 'menu' }, ...btns))));
    }

    drawAll();
    startTurn();
  }

  // 供自動測試使用
  TK.UI = { title, pick, gallery, fight, versus, arcadeStart, reset() { try { localStorage.removeItem(KEY); } catch (e) { /* 忽略 */ } save = load(); } };
  const start = () => title();
  if (document.fonts && document.fonts.load) document.fonts.load('24px Pixel12').then(start, start);
  else start();
})(globalThis.TK = globalThis.TK || {});

</script>
</body>
</html>
