:root {
  --paper: #efe5cf;
  --panel: #f8f1df;
  --panel-2: #fbf5e6;
  --line: rgba(59, 51, 42, .35);
  --ink: #1f1a14;
  --ink-2: #3b332a;
  --dim: #7d7062;
  --hi: #8a2a1f;
  --hi-bg: rgba(178, 58, 44, .12);
  --red: #b23a2c;
  --green: #3d7a4c;
  --gold: #b8892c;
  --hud: #231c15;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1a1612; overflow: hidden; }
body { font-family: Body, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color: var(--ink); user-select: none; }
.hidden { display: none !important; }
.px, h3, .btn { font-family: Pixel12, Body, sans-serif; }

/* ---------- 固定畫面縮放 ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; }
#app {
  position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px;
  transform: translate(-50%, -50%); transform-origin: center center; background: var(--paper); overflow: hidden;
}

/* ---------- 面板 ---------- */
.win {
  position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 6px 18px rgba(59, 51, 42, .22); padding: 12px 16px; font-size: 18px; line-height: 28px; color: var(--ink);
}
.win h3 { margin: 0 0 8px; font-size: 24px; line-height: 30px; font-weight: normal; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.win h3::before { content: ""; width: 7px; height: 7px; background: var(--red); flex: none; }
.dim { color: var(--dim); }
.hi { color: var(--hi); }
.red { color: var(--red); }
.green { color: var(--green); }
.gold { color: var(--gold); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.face { background: #e9eef4; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(0, 0, 0, .15); border-radius: 4px; object-fit: cover; }

/* ---------- 遊戲畫面版面 ---------- */
#status {
  left: 0; top: 0; width: 1280px; height: 60px; border-radius: 0; border: 0; border-bottom: 3px solid var(--red);
  background: var(--hud); color: #f6eedb; padding: 10px 18px; display: flex; gap: 22px; align-items: center; white-space: nowrap; font-size: 18px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .3);
}
#status .hi { color: #ffe3a8; font-family: Pixel12, Body, sans-serif; font-size: 24px; }
#status .seal { display: inline-grid; place-items: center; width: 30px; height: 30px; color: #fff; border: 2px solid rgba(255, 255, 255, .8); margin-right: 8px; vertical-align: middle; font-family: Pixel12, Body; }
#status .grow { flex: 1; text-align: right; color: #c9bda4; overflow: hidden; text-overflow: ellipsis; }

.battle .duel { position: absolute; inset: 0; z-index: 5; background: radial-gradient(ellipse at 50% 70%, #f8f1df 0%, #e8dcc0 60%, #cdbb94 100%); border-radius: 6px; display: flex; flex-direction: column; align-items: center; overflow: hidden; animation: pop .3s ease-out both; }

.battle .duel .dname { font-size: 26px; font-weight: 700; color: var(--hud); }
.battle .duel .dname small { font-size: 15px; color: #7a6a50; margin-left: 8px; font-weight: 400; }

.battle .duel .dface { width: 100%; height: 100%; object-fit: contain; border: 0; background: none; box-shadow: none; }
.battle .duel .fighter.right .dface { transform: scaleX(-1); }
.battle .duel .dbody.lunge { animation: lungeL .45s ease-in-out; }
.battle .duel .fighter.right .dbody.lunge { animation: lungeR .45s ease-in-out; }
.battle .duel .dbody.hit { animation: hitShake .35s; }
.battle .duel .dbody.dodge { animation: dodgeL .35s; }
.battle .duel .fighter.right .dbody.dodge { animation: dodgeR .35s; }
.battle .duel .fighter.down { transform: translateY(40px) rotate(-12deg); opacity: .35; filter: grayscale(1); }
.battle .duel .fighter.right.down { transform: translateY(40px) rotate(12deg); }
.battle .duel .fighter.victor .dbody { animation: victory .5s ease-out 2; }
.battle .duel .dfx { position: absolute; inset: 0; pointer-events: none; }
.battle .duel .dpop { position: absolute; top: 34%; font-family: Pixel12, Body; font-size: 40px; color: var(--red); text-shadow: 0 2px 0 #fff, 0 0 6px #fff; animation: popUp .8s ease-out forwards; }
.battle .duel .dpop.crit { font-size: 52px; color: #d8761a; }

@keyframes lungeL { 0% { transform: none; } 45% { transform: translateX(170px) rotate(6deg); } 100% { transform: none; } }
@keyframes lungeR { 0% { transform: none; } 45% { transform: translateX(-170px) rotate(-6deg); } 100% { transform: none; } }
@keyframes hitShake { 0%,100% { transform: none; filter: none; } 20% { transform: translateX(-12px); filter: brightness(1.8) sepia(1) hue-rotate(-30deg) saturate(4); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@keyframes dodgeL { 0%,100% { transform: none; } 50% { transform: translate(-40px,-10px); } }
@keyframes dodgeR { 0%,100% { transform: none; } 50% { transform: translate(40px,-10px); } }
@keyframes victory { 0%,100% { transform: none; } 50% { transform: translateY(-24px); } }
@keyframes popUp { 0% { opacity: 0; transform: translateY(10px) scale(.6); } 20% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0; transform: translateY(-60px); } }

      ],
    },
  ];

  // 其他補充武將
  Object.assign(STATS, { 李通: [72, 76, 56, 50, 66], 陳群: [50, 30, 86, 92, 76], 郭淮: [84, 74, 76, 66, 66], 王甫: [56, 50, 72, 70, 64] });

  function build(d) {
    const owner = {};
    const cities = BASE.cities.map((c0) => {
      const c = JSON.parse(JSON.stringify(c0));
      const o = d.cities[c.id];
      c.owner = o ? o[0] : null;
      c.troops = o ? o[1] : Math.round(c0.troops * 0.6 / 1000) * 1000;
      c.train = c.owner ? 55 : 40;
      delete c.mix;
      owner[c.id] = c.owner;
      return c;
    });
    const generals = [];
    const add = (name, faction, city, status) => {
      const st = STATS[name];
      if (!st) throw new Error(`劇本 ${d.title}：找不到武將 ${name}`);
      if (!BASE.cities.some((c) => c.id === city)) throw new Error(`劇本 ${d.title}：找不到城市 ${city}`);
      if (generals.some((g) => g.name === name)) throw new Error(`劇本 ${d.title}：武將重複 ${name}`);
      const loy = (d.loyalty && d.loyalty[name]) || 88;
      generals.push({ id: name, name, faction, city, lead: st[0], war: st[1], int: st[2], pol: st[3], cha: st[4],
        loyalty: faction ? loy : 0, status, hidden: status === 'free', ruler: false });
    };
    const split = (s) => (s || '').split(/\s+/).filter(Boolean);
    for (const [fid, byCity] of Object.entries(d.people)) {
      for (const [city, names] of Object.entries(byCity)) {
        for (const n of split(names)) {
          if (owner[city] !== fid) throw new Error(`劇本 ${d.title}：${n} 所在的 ${city} 不屬於 ${fid}`);
          add(n, fid, city, 'active');
        }
      }
    }
    for (const [city, names] of Object.entries(d.free || {})) for (const n of split(names)) add(n, null, city, 'free');
    const factions = d.factions.map(([id, name, ruler, ...heirs]) => {
      const r = generals.find((g) => g.name === ruler);
      if (!r || r.faction !== id) throw new Error(`劇本 ${d.title}：${name} 的君主 ${ruler} 不在勢力中`);
      r.ruler = true;
      r.loyalty = 100;
      return { id, name, ruler, color: COL[id], heirs };
    });
    for (const f of factions) if (!cities.some((c) => c.owner === f.id)) throw new Error(`劇本 ${d.title}：${f.name} 沒有城`);
    return { id: d.id, tag: d.tag, title: d.title, year: d.year, month: d.month, desc: d.desc, aptitude: BASE.aptitude,
      factions, cities, roads: BASE.roads, generals, relations: d.relations || [], events: (d.events || []).map((e) => Object.assign({ historical: true }, e)) };
  }

  BASE.id = '190';
  BASE.tag = '諸侯討伐董卓';
  BASE.desc = '董卓專權，關東諸侯起兵討伐。群雄割據，天下大亂的開端。';
  BASE.relations = BASE.relations || [];
  BASE.events = [];
  TK.SCENARIOS = [BASE, ...DEFS.map(build)];
  TK.scenarioById = (id) => TK.SCENARIOS.find((s) => s.id === (id || '190')) || BASE;
})(globalThis.TK = globalThis.TK || {});

  <script>
/* js/engine.js */
/* 遊戲核心：狀態、指令、戰鬥、回合結算。不碰 DOM，可在 Node 中測試。 */
(function (TK) {
  'use strict';

  const MAX = { farm: 999, commerce: 999, defense: 999, order: 100, train: 100 };
  const NEUTRAL = { lead: 45, war: 45, int: 40 };
  const FREE_STATS = { name: '守軍' };

  // ---------- 亂數（可存檔、可重現） ----------
  function rand(s) {
    let t = (s.seed = (s.seed + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rint(s, a, b) { return a + Math.floor(rand(s) * (b - a + 1)); }

  // 一騎討：雙方體力 100，輪流出招；武力高者命中率與傷害較高。回傳每一招的紀錄供動畫播放。
  function duel(s, a, d) {
    let hpA = 100, hpD = 100;
    const bouts = [];
    for (let n = 0; n < 12 && hpA > 0 && hpD > 0; n++) {
      const who = n % 2 === 0 ? 'a' : 'd';
      const me = who === 'a' ? a : d, foe = who === 'a' ? d : a;
      const hitP = Math.min(0.9, Math.max(0.35, 0.6 + (me.war - foe.war) / 60));
      let dmg = 0, crit = false;
      if (rand(s) < hitP) {
        dmg = Math.max(6, Math.round(14 + (me.war - 60) * 0.45 + rint(s, 0, 10)));
        if (rand(s) < 0.12 + Math.max(0, me.war - 85) / 50) { dmg = Math.round(dmg * 1.8); crit = true; }
      }
      if (who === 'a') hpD = Math.max(0, hpD - dmg); else hpA = Math.max(0, hpA - dmg);
      bouts.push({ who, dmg, crit, hpA, hpD });
    }
    const winner = hpD <= 0 ? 'a' : hpA <= 0 ? 'd' : (hpA >= hpD ? 'a' : 'd');
    return { winner, bouts };
  }
  function pick(s, arr) { return arr[Math.floor(rand(s) * arr.length)]; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- 建立 / 查詢 ----------
  function newGame(playerFaction, seed, mode) {
    const sc = JSON.parse(JSON.stringify(TK.SCENARIO));
    const s = {
      version: 1,
      year: sc.year,
      month: sc.month,
      seed: (seed === undefined ? Date.now() : seed) | 0,
      player: playerFaction,
      factions: {},
      cities: {},
      generals: {},
      roads: sc.roads,
      log: [],
      over: null,
      mode: mode || 'historical',
      relations: {},
      events_done: {},
      harvest_mult: 1,
      pending: [],
      scenario: sc.id || '190',
    };
    for (const f of sc.factions) s.factions[f.id] = Object.assign({ alive: true }, f);
    for (const c of sc.cities) { s.cities[c.id] = c; mixOf(c); }
    for (const g of sc.generals) s.generals[g.id] = Object.assign({ acted: false, formerFaction: null }, g);
    for (const [a, b, st, months] of sc.relations || []) {
      if (TK.Diplomacy && s.factions[a] && s.factions[b]) TK.Diplomacy.setState(s, a, b, st, months || (st === 'truce' ? 12 : 0));
    }
    addLog(s, sc.id && sc.id !== '190' ? `${s.year}年，${sc.title}。${sc.desc}` : `${s.year}年，天下大亂，群雄並起。`, 'sys');
    return s;
  }

  const adjCache = new WeakMap();
  function neighbors(s, cityId) {
    let adj = adjCache.get(s.roads);
    if (!adj) {
      adj = {};
      for (const [a, b] of s.roads) {
        (adj[a] = adj[a] || []).push(b);
        (adj[b] = adj[b] || []).push(a);
      }
      adjCache.set(s.roads, adj);
    }
    return adj[cityId] || [];
  }
  function citiesOf(s, fid) { return Object.values(s.cities).filter((c) => c.owner === fid); }
  function generalsIn(s, cityId, pred) {
    return Object.values(s.generals).filter((g) => g.city === cityId && (!pred || pred(g)));
  }
  function officers(s, cityId) {
    const c = s.cities[cityId];
    return generalsIn(s, cityId, (g) => g.status === 'active' && g.faction === c.owner);
  }
  function factionName(s, fid) { return fid ? s.factions[fid].name : '無主勢力'; }
  function dateStr(s) { return `${s.year}年${s.month}月`; }
  function addLog(s, text, kind, factions) {
    s.log.push({ date: dateStr(s), text, kind: kind || 'info', factions: factions || [] });
    if (s.log.length > 400) s.log.splice(0, s.log.length - 400);
  }

  // ---------- 兵種 ----------
  // 槍剋騎、騎剋弩、弩剋槍。cost＝每 1000 兵所需金
  const UNITS = {
    spear: { name: '槍兵', short: '槍', cost: 100, desc: '陣型穩固、損失較少，剋制騎兵' },
    cav: { name: '騎兵', short: '騎', cost: 200, desc: '進攻時衝鋒加成，剋制弩兵' },
    xbow: { name: '弩兵', short: '弩', cost: 150, desc: '守城時加成、首輪齊射，剋制槍兵' },
  };
  const UNIT_KEYS = ['spear', 'cav', 'xbow'];
  const BEATS = { spear: 'cav', cav: 'xbow', xbow: 'spear' };
  const APT_MULT = { S: 1.18, A: 1.07, B: 1, C: 0.9 };

  function matchup(a, d) { return a === d ? 1 : BEATS[a] === d ? 1.3 : 0.8; }

  // 武將兵種適性：劇本可指定，否則依能力推得
  function aptitude(g, type) {
    if (!g) return 'C';
    const o = (TK.SCENARIO.aptitude || {})[g.name];
    if (o && o[type]) return o[type];
    if (type === 'spear') return g.lead >= 85 || g.war >= 88 ? 'A' : g.lead >= 68 ? 'B' : 'C';
    if (type === 'cav') return g.war >= 85 ? 'A' : g.war >= 70 ? 'B' : 'C';
    return g.int >= 85 ? 'A' : g.int >= 68 || g.lead >= 80 ? 'B' : 'C';
  }

  const FACTION_MIX = {
    ma: { spear: 0.3, cav: 0.5, xbow: 0.2 }, gongsun: { spear: 0.3, cav: 0.5, xbow: 0.2 }, dong: { spear: 0.35, cav: 0.45, xbow: 0.2 },
    sun: { spear: 0.4, cav: 0.15, xbow: 0.45 }, liubiao: { spear: 0.4, cav: 0.15, xbow: 0.45 },
  };
  function defaultMix(c) {
    const r = !c.owner ? { spear: 0.55, cav: 0.1, xbow: 0.35 } : FACTION_MIX[c.owner] || { spear: 0.45, cav: 0.25, xbow: 0.3 };
    const m = { spear: Math.floor(c.troops * r.spear), cav: Math.floor(c.troops * r.cav), xbow: 0 };
    m.xbow = c.troops - m.spear - m.cav;
    return m;
  }
  // 依比例分配 total，回傳整數且總和精確
  function scaleMix(mix, total) {
    const sum = UNIT_KEYS.reduce((a, k) => a + (mix[k] || 0), 0);
    const out = { spear: 0, cav: 0, xbow: 0 };
    if (total <= 0) return out;
    if (sum <= 0) { out.spear = total; return out; }
    let acc = 0, big = 'spear';
    for (const k of UNIT_KEYS) {
      out[k] = Math.floor((mix[k] || 0) * total / sum);
      acc += out[k];
      if ((mix[k] || 0) > (mix[big] || 0)) big = k;
    }
    out[big] += total - acc;
    return out;
  }
  // 取得城市兵種組成；troops 為準，組成不一致時依比例校正
  function mixOf(c) {
    if (!c.mix) c.mix = defaultMix(c);
    const sum = c.mix.spear + c.mix.cav + c.mix.xbow;
    if (sum !== c.troops) c.mix = scaleMix(c.mix, c.troops);
    return c.mix;
  }
  function addUnits(c, units, train) {
    mixOf(c);
    const n = UNIT_KEYS.reduce((a, k) => a + (units[k] || 0), 0);
    if (n <= 0) return;
    if (train !== undefined) c.train = Math.round((c.train * c.troops + train * n) / (c.troops + n));
    for (const k of UNIT_KEYS) c.mix[k] += units[k] || 0;
    c.troops += n;
  }
  function takeUnits(c, units) {
    mixOf(c);
    for (const k of UNIT_KEYS) { c.mix[k] -= units[k] || 0; c.troops -= units[k] || 0; }
  }
  function unitsTotal(u) { return UNIT_KEYS.reduce((a, k) => a + (u[k] || 0), 0); }
  // 指令可給 units（分兵種）或 troops（依城內比例）
  function unitsFromCmd(c, cmd) {
    mixOf(c);
    if (cmd.units) {
      const u = {};
      for (const k of UNIT_KEYS) {
        u[k] = Math.floor(cmd.units[k] || 0);
        if (u[k] < 0 || u[k] > c.mix[k]) return null;
      }
      return u;
    }
    const n = Math.floor(cmd.troops || 0);
    if (n < 0 || n > c.troops) return null;
    return scaleMix(c.mix, n);
  }
  function fractions(u) {
    const t = unitsTotal(u) || 1;
    return { spear: (u.spear || 0) / t, cav: (u.cav || 0) / t, xbow: (u.xbow || 0) / t };
  }
  function mixName(u) {
    return UNIT_KEYS.filter((k) => u[k] > 0).map((k) => `${UNITS[k].short}${u[k]}`).join('・') || '無兵';
  }

  // ---------- 指令 ----------
  const DEV = {
    farm: { label: '開墾', cost: 50, stat: 'pol', key: 'farm' },
    commerce: { label: '商業', cost: 50, stat: 'pol', key: 'commerce' },
    defense: { label: '築城', cost: 60, stat: 'lead', key: 'defense' },
    order: { label: '巡察', cost: 30, stat: 'cha', key: 'order' },
    train: { label: '訓練', cost: 0, stat: 'lead', key: 'train' },
  };

  function maxDraft(s, city, g, type) {
    const cost = UNITS[type || 'spear'].cost;
    return Math.max(0, Math.min(g.cha * 100, Math.floor(city.gold * 1000 / cost), Math.floor(city.pop / 5), 120000 - city.troops));
  }

  function recruitChance(s, g, target) {
    if (target.ruler) return 0;
    if (target.status === 'free') return clamp(0.15 + (g.cha / 100) * 0.55, 0, 0.75);
    if (target.status === 'prisoner') return clamp(0.05 + (g.cha / 100) * 0.45 - (target.loyalty - 50) / 200, 0.02, 0.6);
    return 0;
  }

  // 舊存檔補上新欄位
  function ensure(s) {
    if (!s.relations) s.relations = {};
    if (!s.events_done) s.events_done = {};
    if (!s.pending) s.pending = [];
    if (!s.mode) s.mode = 'historical';
    if (!s.harvest_mult) s.harvest_mult = 1;
    if (!s.scenario) s.scenario = '190';
  }

  // 回傳 {ok, msg}
  function exec(s, fid, cmd) {
    if (s.over) return fail('遊戲已結束');
    ensure(s);
    if (cmd.type === 'diplo') return TK.Diplomacy.exec(s, fid, cmd);
    const city = s.cities[cmd.city];
    if (!city || city.owner !== fid) return fail('不是我方城市');
    let g = null;
    const needsExec = !['reward', 'release', 'execute'].includes(cmd.type);
    if (needsExec) {
      g = s.generals[cmd.general];
      if (!g || g.faction !== fid || g.status !== 'active' || g.city !== city.id) return fail('武將不在此城');
      if (g.acted) return fail(`${g.name}本月已行動`);
    }

    if (DEV[cmd.type]) {
      const d = DEV[cmd.type];
      if (city.gold < d.cost) return fail('金不足');
      if (city[d.key] >= MAX[d.key]) return fail(`${d.label}已達上限`);
      city.gold -= d.cost;
      const st = g[d.stat];
      const gain = cmd.type === 'order' || cmd.type === 'train'
        ? Math.round(st / 20 + rint(s, 1, 4))
        : Math.round(st / 10 + rint(s, 0, 5));
      city[d.key] = Math.min(MAX[d.key], city[d.key] + gain);
      g.acted = true;
      return ok(`${g.name}於${city.name}${d.label}，${labelOf(d.key)} +${gain}`);
    }

    switch (cmd.type) {
      case 'draft': {
        const type = UNITS[cmd.unit] ? cmd.unit : 'spear';
        const amt = Math.floor(cmd.amount || 0);
        const max = maxDraft(s, city, g, type);
        if (amt < 100) return fail('徵兵數至少 100');
        if (amt > max) return fail(`最多可徵 ${max}`);
        city.gold -= Math.ceil(amt * UNITS[type].cost / 1000);
        city.pop -= amt;
        addUnits(city, { [type]: amt }, 20);
        city.order = Math.max(0, city.order - Math.ceil(amt / 2000));
        g.acted = true;
        return ok(`${g.name}於${city.name}徵募${UNITS[type].name} ${amt}`);
      }
      case 'search': {
        g.acted = true;
        const hidden = generalsIn(s, city.id, (x) => x.status === 'free' && x.hidden);
        if (hidden.length && rand(s) < 0.25 + g.int / 200) {
          const f = pick(s, hidden);
          f.hidden = false;
          return ok(`${g.name}在${city.name}發現了人才「${f.name}」！`);
        }
        if (rand(s) < 0.4) {
          const gold = rint(s, 30, 120);
          city.gold += gold;
          return ok(`${g.name}在${city.name}搜索，得到金 ${gold}`);
        }
        return ok(`${g.name}在${city.name}搜索，一無所獲`);
      }
      case 'recruit': {
        const t = s.generals[cmd.target];
        if (!t || t.city !== city.id || !(t.status === 'prisoner' || (t.status === 'free' && !t.hidden))) {
          return fail('找不到登用對象');
        }
        g.acted = true;
        const p = recruitChance(s, g, t);
        if (rand(s) < p) {
          joinFaction(t, fid, rint(s, 60, 80));
          t.acted = true;
          return ok(`${t.name}接受了${g.name}的邀請，加入${factionName(s, fid)}！`);
        }
        return ok(`${t.name}拒絕了${g.name}的登用`);
      }
      case 'reward': {
        const t = s.generals[cmd.target];
        if (!t || t.faction !== fid || t.city !== city.id || t.status !== 'active') return fail('找不到武將');
        if (t.ruler) return fail('不能賞賜君主');
        if (city.gold < 100) return fail('金不足');
        if (t.loyalty >= 100) return fail('忠誠已滿');
        city.gold -= 100;
        const gain = rint(s, 5, 10);
        t.loyalty = Math.min(100, t.loyalty + gain);
        return ok(`賞賜${t.name}，忠誠 +${gain}`);
      }
      case 'release':
      case 'execute': {
        const t = s.generals[cmd.target];
        if (!t || t.city !== city.id || t.status !== 'prisoner') return fail('找不到俘虜');
        if (cmd.type === 'release') {
          t.status = 'free';
          t.hidden = false;
          return ok(`釋放了${t.name}`);
        }
        t.status = 'dead';
        t.city = null;
        return ok(`處斬了${t.name}`);
      }
      case 'move': {
        const dest = s.cities[cmd.dest];
        if (!dest || dest.owner !== fid || !neighbors(s, city.id).includes(dest.id)) return fail('目的地不正確');
        const ids = uniq([g.id].concat(cmd.generals || []));
        const movers = ids.map((id) => s.generals[id]);
        for (const m of movers) {
          if (!m || m.faction !== fid || m.city !== city.id || m.status !== 'active' || m.acted) return fail('有武將無法移動');
        }
        const units = unitsFromCmd(city, cmd);
        const gold = Math.floor(cmd.gold || 0), food = Math.floor(cmd.food || 0);
        if (!units || gold < 0 || gold > city.gold || food < 0 || food > city.food) {
          return fail('兵、金或糧數量不正確');
        }
        const troops = unitsTotal(units);
        mixOf(dest);
        takeUnits(city, units);
        addUnits(dest, units, city.train);
        city.gold -= gold; dest.gold += gold;
        city.food -= food; dest.food += food;
        for (const m of movers) { m.city = dest.id; m.acted = true; }
        return ok(`${movers.map((m) => m.name).join('、')}率兵 ${troops} 移動至${dest.name}`);
      }
      case 'attack': {
        const target = s.cities[cmd.target];
        if (!target || target.owner === fid || !neighbors(s, city.id).includes(target.id)) return fail('無法進攻該城');
        if (TK.Diplomacy && !TK.Diplomacy.canAttack(s, fid, target.owner)) {
          return fail(`與${factionName(s, target.owner)}處於${TK.Diplomacy.STATE_LABEL[TK.Diplomacy.stateOf(s, fid, target.owner)]}，不能進攻`);
        }
        const ids = uniq([g.id].concat(cmd.generals || [])).slice(0, 3);
        const army = ids.map((id) => s.generals[id]);
        for (const m of army) {
          if (!m || m.faction !== fid || m.city !== city.id || m.status !== 'active' || m.acted) return fail('有武將無法出陣');
        }
        const units = unitsFromCmd(city, cmd);
        if (!units) return fail('兵力不足');
        const troops = unitsTotal(units);
        if (troops < 1000) return fail('出陣兵力至少 1000');
        const foodNeed = Math.ceil(troops / 10);
        if (city.food < foodNeed) return fail(`軍糧不足（需 ${foodNeed}）`);
        city.food -= foodNeed;
        takeUnits(city, units);
        for (const m of army) m.acted = true;
        if (TK.Diplomacy) TK.Diplomacy.onAttack(s, fid, target.owner);
        const res = battle(s, { faction: fid, generals: army, troops, units, train: city.train, from: city.id }, target.id);
        return ok(res.summary, res);
      }
      default:
        return fail('未知指令');
    }
  }

  function ok(msg, extra) { return Object.assign({ ok: true, msg }, extra ? { battle: extra } : {}); }
  function fail(msg) { return { ok: false, msg }; }
  function uniq(a) { return Array.from(new Set(a)); }
  function labelOf(k) {
    return { farm: '農業', commerce: '商業', defense: '城防', order: '民心', train: '訓練' }[k] || k;
  }

  function joinFaction(g, fid, loyalty) {
    g.faction = fid;
    g.status = 'active';
    g.hidden = false;
    g.loyalty = loyalty;
    g.formerFaction = null;
  }


  // ---------- 戰鬥 ----------
  function sideStats(gens) {
    if (!gens.length) return Object.assign({}, NEUTRAL);
    const cmdr = gens.slice().sort((a, b) => b.lead - a.lead)[0];
    return {
      lead: cmdr.lead,
      war: Math.max.apply(null, gens.map((x) => x.war)),
      int: Math.max.apply(null, gens.map((x) => x.int)),
      commander: cmdr,
    };
  }

  function battle(s, atk, targetId) {
    const city = s.cities[targetId];
    const defOwner = city.owner;
    const defGens = defOwner ? officers(s, city.id).sort((a, b) => b.lead - a.lead).slice(0, 3) : [];
    const A = Object.assign(sideStats(atk.generals), { troops: atk.troops, train: atk.train });
    const D = Object.assign(sideStats(defGens), { troops: city.troops, train: city.train });
    // 兵種：雙方組成比例、相剋、主將適性
    const aUnits = atk.units || { spear: atk.troops, cav: 0, xbow: 0 };
    const dUnits = Object.assign({}, mixOf(city));
    const fA = fractions(aUnits), fD = fractions(dUnits);
    let mA = 0, mD = 0, aptA = 0, aptD = 0;
    for (const a of UNIT_KEYS) {
      for (const d of UNIT_KEYS) { mA += fA[a] * fD[d] * matchup(a, d); mD += fD[d] * fA[a] * matchup(d, a); }

    }

    const bonusD = mD * aptD * (1 + 0.15 * fD.xbow);
    const sturdyA = 1 - 0.1 * fA.spear, sturdyD = 1 - 0.1 * fD.spear;
    const A0 = A.troops, D0 = D.troops;
    const aName = factionName(s, atk.faction), dName = factionName(s, defOwner);
    const parties = [atk.faction, defOwner].filter(Boolean);
    const lines = [];
    const aCmd = A.commander ? A.commander.name : '';
    const dCmd = D.commander ? D.commander.name : FREE_STATS.name;
    lines.push(`${aName}（${aCmd}，${A0}兵）自${atk.from}進攻${city.name}（${dName}，${dCmd}，${D0}兵）`);
    // frames：給戰鬥畫面逐格播放 {a, d, ev, kind}
    const frames = [{ a: A0, d: D0, ev: null }];
    const domA = UNIT_KEYS.reduce((b, k) => (fA[k] > fA[b] ? k : b), 'spear');
    const domD = UNIT_KEYS.reduce((b, k) => (fD[k] > fD[b] ? k : b), 'spear');
    if (mA > 1.06) lines.push(`兵種相剋：${aName}的${UNITS[domA].name}佔上風`);
    else if (mD > 1.06) lines.push(`兵種相剋：守軍的${UNITS[domD].name}佔上風`);

    // 單挑：雙方最強武將武力夠高時常會出陣一騎討（約六成機率）
    const ahero = atk.generals.slice().sort((a, b) => b.war - a.war)[0];
    const dhero = defGens.slice().sort((a, b) => b.war - a.war)[0];
    if (ahero && dhero && Math.max(ahero.war, dhero.war) >= 70 && Math.min(ahero.war, dhero.war) >= 50 && rand(s) < 0.6) {
      const d = duel(s, ahero, dhero);
      const winner = d.winner === 'a' ? ahero : dhero, loser = d.winner === 'a' ? dhero : ahero;
      lines.push(`單挑！${ahero.name} 對 ${dhero.name}，${d.bouts.length}回合後${winner.name}擊退了${loser.name}`);
      // 勝方士氣大振，敗方軍心動搖
      if (d.winner === 'a') D.troops = Math.round(D.troops * 0.85);
      else A.troops = Math.round(A.troops * 0.85);
      frames.push({ a: A.troops, d: D.troops, ev: `${ahero.name} 對 ${dhero.name}，${winner.name}勝！`, kind: 'duel', duel: [ahero.name, dhero.name], winner: d.winner, bouts: d.bouts });
    }

    let result = null, schemes = 0;
    for (let round = 1; round <= 20 && !result; round++) {

      const powD = D.troops * (0.6 * D.lead + 0.4 * D.war) / 100 * (0.7 + D.train / 100 * 0.6) * (1 + city.defense / 800) * bonusD;
      let lossD = Math.round(powA * 0.08 * (0.85 + rand(s) * 0.3) * sturdyD);
      let ev = null, kind = null;
      let lossA = Math.round(powD * 0.08 * (0.85 + rand(s) * 0.3) * sturdyA);
      if (round === 1) {
        // 開戰：弩兵齊射、騎兵衝鋒
        if (fA.xbow >= 0.3) { lossD = Math.round(lossD * (1 + fA.xbow)); ev = `${aName}弩兵齊射！`; kind = 'volley-a'; }
        if (fD.xbow >= 0.3) { lossA = Math.round(lossA * (1 + fD.xbow)); ev = `城上弩箭如雨！`; kind = 'volley-d'; }
        if (fA.cav >= 0.3) {
          if (fD.spear >= 0.4) { lossA = Math.round(lossA * 1.25); ev = '騎兵衝鋒，撞上槍陣！'; kind = 'charge-fail'; }
          else { lossD = Math.round(lossD * (1 + fA.cav * 0.8)); ev = `${aName}騎兵衝鋒！`; kind = 'charge'; }
        }
        if (ev) lines.push(ev);
      }
      if (A.int >= 75 && rand(s) < (A.int - 60) / 200) {
        lossD = Math.round(lossD * 1.5);
        ev = `${aName}施展計略，守軍陷入混亂`; kind = 'scheme-a';
        if (schemes++ < 2) lines.push(`${aName}施展計略，${city.name}守軍陷入混亂`);
      }
      if (D.int >= 75 && rand(s) < (D.int - 60) / 200) {
        lossA = Math.round(lossA * 1.5);
        ev = `${dName}識破敵計並反擊`; kind = 'scheme-d';
        if (schemes++ < 2) lines.push(`${dName}識破敵計並反擊`);
      }
      A.troops = Math.max(0, A.troops - lossA);
      D.troops = Math.max(0, D.troops - lossD);

      frames.push({ a: A.troops, d: D.troops, ev, kind });

      if (D.troops <= 0) result = 'win';
      else if (A.troops <= 0) result = 'lose';
      else if (D.troops < D0 * 0.2 && D.troops < A.troops * 0.5) { result = 'win'; D.troops = 0; }
      else if (A.troops < A0 * 0.3 && A.troops < D.troops) result = 'lose';
    }
    if (!result) { result = 'lose'; lines.push('久攻不下，撤兵'); }
    const aLeft = scaleMix(aUnits, A.troops);
    frames[frames.length - 1].a = A.troops;
    frames[frames.length - 1].d = D.troops;

    city.troops = D.troops;
    let summary;
    if (result === 'win') {

    } else {

      if (home.owner === atk.faction) addUnits(home, aLeft, atk.train);
      summary = `${aName}進攻${city.name}失敗（我損 ${A0 - A.troops}，敵損 ${D0 - D.troops}）`;
    }

    const res = {
      result, summary, lines, frames, atkLoss: A0 - A.troops, defLoss: D0 - D.troops,
      city: city.id, from: atk.from,
      atk: { faction: atk.faction, name: aName, commander: aCmd, generals: atk.generals.map((g) => g.name), troops: A0, units: aUnits },
      def: { faction: defOwner, name: dName, commander: dCmd, generals: defGens.map((g) => g.name), troops: D0, units: dUnits },
    };
    if (TK.Engine && typeof TK.Engine.onBattle === 'function') TK.Engine.onBattle(res);

  }

  function conquer(s, city, atk, A, lines, aLeft) {
    const oldOwner = city.owner;
    const defenders = oldOwner ? generalsIn(s, city.id, (g) => g.status === 'active' && g.faction === oldOwner) : [];
    city.owner = atk.faction;

    city.mix = aLeft;
    city.train = atk.train;
    city.order = Math.max(10, city.order - 15);

    if (oldOwner) {
      const escapes = neighbors(s, city.id).filter((id) => s.cities[id].owner === oldOwner);
      for (const g of defenders) {
        if (escapes.length && (g.ruler || rand(s) < 0.5 + g.war / 400)) {
          g.city = pick(s, escapes);
          lines.push(`${g.name}逃往${g.city}`);
        } else {
          g.status = 'prisoner';
          g.formerFaction = oldOwner;
          g.faction = null;
          lines.push(`${g.name}被俘`);

    for (const p of generalsIn(s, city.id, (g) => g.status === 'prisoner' && g.formerFaction === atk.faction)) {
      joinFaction(p, atk.faction, Math.max(p.loyalty, 70));

  }

  // 君主去世：由繼承人（資料指定，否則魅力最高者）接任
  function rulerDies(s, fid) {
    const f = s.factions[fid];

    const act = (g) => g && g.status === 'active' && g.faction === fid;

    if (!heir) heir = Object.values(s.generals).filter(act).sort((a, b) => b.cha - a.cha)[0];

    heir.ruler = true;
    heir.loyalty = 100;
    f.ruler = heir.name;

  function destroyFaction(s, fid) {

  function endTurn(s) {

    // 打亂 AI 順序

      const j = Math.floor(rand(s) * (i + 1));

      const ord = 0.5 + c.order / 200;
      c.gold += Math.round(c.commerce * 0.35 * ord + c.pop / 10000);
      if (s.month === 7) {
        const harvest = Math.round(c.farm * 30 * ord * (s.harvest_mult || 1));
        c.food += harvest;
        if (c.owner === s.player) addLog(s, `${c.name}秋收，得糧 ${harvest}`, 'info', [c.owner]);

      c.food -= Math.ceil(c.troops / 40);
      if (c.food < 0) {

        const lost = Math.round(c.troops * 0.1);

      gold: cs.reduce((a, c) => a + c.gold, 0),

  <script>
/* js/ai.js */
/* 電腦勢力：規則式 AI，只透過 Engine.exec 下指令，與玩家遵守相同規則。 */
(function (TK) {
  'use strict';
  const E = () => TK.Engine;

  function defenseValue(s, city) {
    const gens = E().officers(s, city.id);
    const lead = gens.length ? Math.max.apply(null, gens.map((g) => g.lead)) : 45;
    return city.troops * (1 + city.defense / 800) * (0.5 + lead / 200);
  }

  function threatTo(s, city) {
    let t = 0;
    for (const n of E().neighbors(s, city.id)) {
      const c = s.cities[n];
      if (c.owner && c.owner !== city.owner && (!TK.Diplomacy || TK.Diplomacy.canAttack(s, c.owner, city.owner))) t = Math.max(t, c.troops);
    }
    return t;
  }

  function idle(s, cityId, fid) {
    return E().officers(s, cityId).filter((g) => g.faction === fid && !g.acted);
  }

  function run(s, fid) {
    const Eng = E();
    const cities = Eng.citiesOf(s, fid);

    for (const city of cities) {
      if (city.owner !== fid) continue; // 本回合可能已失守

      // 俘虜：登用或釋放
      for (const p of Eng.generalsIn(s, city.id, (g) => g.status === 'prisoner')) {
        const rec = idle(s, city.id, fid).sort((a, b) => b.cha - a.cha)[0];
        if (rec && Eng.recruitChance(s, rec, p) > 0.15) Eng.exec(s, fid, { type: 'recruit', city: city.id, general: rec.id, target: p.id });
        else if (p.ruler || E().rand(s) < 0.3) Eng.exec(s, fid, { type: 'release', city: city.id, target: p.id });
      }

      // 進攻
      tryAttack(s, fid, city);

      // 內政
      const threat = threatTo(s, city);
      for (const g of idle(s, city.id, fid)) {
        if (g.acted) continue;
        const free = Eng.generalsIn(s, city.id, (x) => x.status === 'free' && !x.hidden);
        if (free.length && g.cha >= 60) {
          Eng.exec(s, fid, { type: 'recruit', city: city.id, general: g.id, target: free[0].id });
          continue;
        }
        const want = threat ? Math.max(threat * 1.1, 8000) : 8000;
        const unit = draftUnit(s, city, g);
        const max = Eng.maxDraft(s, city, g, unit);
        if (city.troops < want && max >= 1000 && city.gold > 300 && city.food > city.troops / 40 * 6) {
          Eng.exec(s, fid, { type: 'draft', city: city.id, general: g.id, unit, amount: Math.min(max, Math.round(want - city.troops) + 1000, 5000) });
          continue;
        }
        if (city.train < 70 && city.troops > 3000) {
          Eng.exec(s, fid, { type: 'train', city: city.id, general: g.id });
          continue;
        }
        if (Eng.rand(s) < 0.15 && Eng.generalsIn(s, city.id, (x) => x.status === 'free' && x.hidden).length) {
          Eng.exec(s, fid, { type: 'search', city: city.id, general: g.id });
          continue;
        }
        const opts = [
          ['order', city.order < 60 ? 3 : city.order < 90 ? 1 : 0],
          ['farm', city.farm < 999 ? 2 : 0],
          ['commerce', city.commerce < 999 ? 2 : 0],
          ['defense', city.defense < 999 ? (threat ? 2 : 0.5) : 0],
        ].filter((o) => o[1] > 0);
        if (!opts.length) { Eng.exec(s, fid, { type: 'train', city: city.id, general: g.id }); continue; }
        const total = opts.reduce((a, o) => a + o[1], 0);
        let r = Eng.rand(s) * total, choice = opts[0][0];
        for (const o of opts) { if ((r -= o[1]) <= 0) { choice = o[0]; break; } }
        Eng.exec(s, fid, { type: choice, city: city.id, general: g.id });
      }
    }

    // 後方往前線輸送兵力與武將
    for (const city of Eng.citiesOf(s, fid)) {
      if (threatTo(s, city) > 0 || hasNeutralNeighbor(s, city)) continue;
      const fronts = Eng.neighbors(s, city.id).map((id) => s.cities[id]).filter((c) => c.owner === fid);
      if (!fronts.length) continue;
      const dest = fronts.sort((a, b) => threatTo(s, b) - threatTo(s, a))[0];
      const movers = idle(s, city.id, fid).sort((a, b) => b.lead - a.lead);
      const all = Eng.officers(s, city.id);
      if (!movers.length || all.length < 2) continue; // 至少留一人守城
      const carrier = movers[0];
      const extra = all.length >= 4 && movers.length >= 2 ? [movers[1].id] : [];
      Eng.exec(s, fid, {
        type: 'move', city: city.id, general: carrier.id, dest: dest.id, generals: extra,
        troops: Math.floor(city.troops * 0.6), gold: Math.floor(city.gold * 0.3), food: Math.floor(city.food * 0.3),
      });
    }
  }

  // 選擇徵募的兵種：剋制鄰近敵軍最多的兵種，並參考武將適性與金錢
  function draftUnit(s, city, g) {
    const Eng = E();
    const enemy = { spear: 0, cav: 0, xbow: 0 };
    for (const n of Eng.neighbors(s, city.id)) {
      const c = s.cities[n];
      if (c.owner === city.owner) continue;
      const m = Eng.mixOf(c);
      for (const k of Eng.UNIT_KEYS) enemy[k] += m[k];

    let best = 'spear', bestScore = -1;
    for (const k of Eng.UNIT_KEYS) {
      let score = 0;
      for (const d of Eng.UNIT_KEYS) score += enemy[d] * Eng.matchup(k, d);
      score *= Eng.APT_MULT[Eng.aptitude(g, k)];
      if (city.gold < Eng.UNITS[k].cost * 3) score *= 0.5;
      score *= 0.9 + Eng.rand(s) * 0.2;
      if (score > bestScore) { bestScore = score; best = k; }
    }
    return best;
  }

  function hasNeutralNeighbor(s, city) {
    return E().neighbors(s, city.id).some((id) => s.cities[id].owner !== city.owner);
  }

  function tryAttack(s, fid, city) {
    const Eng = E();
    const avail = idle(s, city.id, fid).sort((a, b) => (b.lead + b.war) - (a.lead + a.war));
    const all = Eng.officers(s, city.id);
    if (!avail.length || city.troops < 8000) return;
    const targets = Eng.neighbors(s, city.id).map((id) => s.cities[id]).filter((c) => c.owner !== fid && (!TK.Diplomacy || TK.Diplomacy.canAttack(s, fid, c.owner)));
    if (!targets.length) return;

    const army = avail.slice(0, Math.min(3, all.length > 1 ? Math.min(avail.length, all.length - 1) : 1));
    const troops = Math.floor(city.troops * 0.75);
    const lead = army[0].lead, war = Math.max.apply(null, army.map((g) => g.war));
    const myPow = troops * (0.6 * lead + 0.4 * war) / 100 * (0.7 + city.train / 100 * 0.6);

    let best = null, bestRatio = 0;
    for (const t of targets) {
      const gens = t.owner ? Eng.officers(s, t.id) : [];
      const tl = gens.length ? Math.max.apply(null, gens.map((g) => g.lead)) : 45;
      const tw = gens.length ? Math.max.apply(null, gens.map((g) => g.war)) : 45;
      const dPow = Math.max(1, t.troops * (0.6 * tl + 0.4 * tw) / 100 * (0.7 + t.train / 100 * 0.6) * (1 + t.defense / 800));
      // 不輕易對中立勢力開戰

/* js/diplomacy.js */
/* 外交：同盟、停戰、宣戰、勸降。關係存在 s.relations['a|b'] = {state, months, rel}
 * state：neutral（可開戰）、war、truce（停戰中不可攻擊）、alliance（同盟不可攻擊）。規則為本作原創。 */
(function (TK) {
  'use strict';
  const E = () => TK.Engine;

  const STATE_LABEL = { neutral: '中立', war: '交戰', truce: '停戰', alliance: '同盟' };
  const ACTIONS = {
    alliance: { label: '同盟', cost: 300 },
    truce: { label: '停戰', cost: 200 },
    war: { label: '宣戰', cost: 0 },
    surrender: { label: '勸降', cost: 100 },
  };

  const key = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
  function rel(s, a, b) {
    if (!s.relations) s.relations = {};
    const k = key(a, b);
    if (!s.relations[k]) s.relations[k] = { state: 'neutral', months: 0, rel: 0 };
    return s.relations[k];
  }
  function setState(s, a, b, state, months) {
    const r = rel(s, a, b);
    r.state = state;
    r.months = months || 0;
    if (state === 'alliance') r.rel = Math.max(r.rel, 40);
    if (state === 'war') r.rel = Math.min(r.rel, -20);
  }
  function stateOf(s, a, b) {
    if (!a || !b || a === b) return 'neutral';
    return rel(s, a, b).state;
  }
  function canAttack(s, a, b) {
    if (!b) return true;
    if (a === b) return false;
    const st = stateOf(s, a, b);
    return st !== 'alliance' && st !== 'truce';
  }
  function onAttack(s, a, b) {
    if (!b) return;
    const r = rel(s, a, b);
    if (r.state === 'neutral') {
      r.state = 'war';
      r.rel -= 30;
      E().addLog(s, `${E().factionName(s, a)}向${E().factionName(s, b)}開戰！`, 'major', [a, b]);
    }
  }
  function power(s, fid) {
    return E().citiesOf(s, fid).reduce((a, c) => a + c.troops + 2000, 0);
  }
  function atWarWith(s, fid) {
    return Object.values(s.factions).filter((f) => f.alive && f.id !== fid && stateOf(s, fid, f.id) === 'war').map((f) => f.id);
  }

  function chance(s, fid, target, action, envoy) {
    const r = rel(s, fid, target);
    const ratio = power(s, fid) / Math.max(1, power(s, target));
    let p = 0;
    if (action === 'alliance') {
      if (r.state === 'war' || r.state === 'alliance') return 0;
      p = 0.08 + envoy.cha / 220 + r.rel / 200;
      if (atWarWith(s, target).some((e) => e !== fid && stateOf(s, fid, e) === 'war')) p += 0.15;
      if (ratio < 0.4) p -= 0.1;
    } else if (action === 'truce') {
      if (r.state !== 'war') return 0;
      p = 0.12 + envoy.int / 260 + r.rel / 300;
      if (ratio > 1.3) p += 0.15; else if (ratio < 0.7) p -= 0.08;
    } else if (action === 'war') {
      return r.state !== 'war' ? 1 : 0;
    } else if (action === 'surrender') {
      if (ratio < 3) return 0;
      p = Math.min(0.45, (ratio - 3) / 6) + envoy.cha / 400 - 0.05;
      if (r.state === 'alliance') p -= 0.1;
    }
    return Math.max(0.02, Math.min(0.85, p));
  }

  function absorb(s, fid, target) {
    for (const c of E().citiesOf(s, target)) c.owner = fid;
    for (const g of Object.values(s.generals)) {
      if (g.faction === target && g.status === 'active') {
        g.ruler = false;
        g.faction = fid;
        g.loyalty = 60 + E().rint(s, 0, 15);
      }
    }
    s.factions[target].alive = false;
    E().addLog(s, `${s.factions[target].name}歸順了${E().factionName(s, fid)}。`, 'major', [fid, target]);
  }

  // {type:'diplo', action, target, general}
  function exec(s, fid, cmd) {
    const a = ACTIONS[cmd.action];
    const target = cmd.target;
    if (!a) return { ok: false, msg: '未知的外交行動' };
    if (!target || target === fid || !s.factions[target] || !s.factions[target].alive) return { ok: false, msg: '對象不正確' };
    const g = s.generals[cmd.general];
    if (!g || g.faction !== fid || g.status !== 'active') return { ok: false, msg: '使者不正確' };
    if (g.acted) return { ok: false, msg: `${g.name}本月已行動` };
    const city = s.cities[g.city];
    if (city.gold < a.cost) return { ok: false, msg: `金不足（需 ${a.cost}）` };
    const p = chance(s, fid, target, cmd.action, g);
    if (p <= 0) return { ok: false, msg: `目前無法${a.label}` };
    city.gold -= a.cost;
    g.acted = true;
    const fname = E().factionName(s, fid), tname = E().factionName(s, target);
    const r = rel(s, fid, target);
    if (cmd.action === 'war') {
      const betrayal = r.state === 'alliance' || r.state === 'truce';
      setState(s, fid, target, 'war');
      if (betrayal) for (const x of Object.values(s.generals)) if (x.faction === fid && x.status === 'active' && !x.ruler) x.loyalty = Math.max(0, x.loyalty - 5);
      const msg = `${fname}向${tname}宣戰！${betrayal ? '（背棄盟約，部下忠誠下降）' : ''}`;
      E().addLog(s, msg, 'major', [fid, target]);
      return { ok: true, msg, success: true };
    }
    if (E().rand(s) >= p) {
      r.rel -= 5;
      const msg = `${g.name}出使${tname}，${a.label}遭到拒絕。`;
      E().addLog(s, msg, 'info', [fid, target]);
      return { ok: true, msg, success: false };
    }
    if (cmd.action === 'alliance') setState(s, fid, target, 'alliance');
    else if (cmd.action === 'truce') setState(s, fid, target, 'truce', 12);
    else if (cmd.action === 'surrender') absorb(s, fid, target);
    const msg = `${g.name}出使${tname}，${a.label}成功！`;
    E().addLog(s, msg, 'major', [fid, target]);
    return { ok: true, msg, success: true };
  }

  function monthTick(s) {
    for (const [k, r] of Object.entries(s.relations || {})) {
      if (r.state === 'truce' && --r.months <= 0) {
        r.state = 'neutral';
        const [a, b] = k.split('|');
        E().addLog(s, `${E().factionName(s, a)}與${E().factionName(s, b)}的停戰期滿。`, 'info', [a, b]);
      }
      if (r.rel > 0) r.rel -= 1; else if (r.rel < 0) r.rel += 1;
    }
  }

  // 電腦勢力的外交判斷；對玩家的提案放入 s.pending
  function aiConsider(s, fid) {
    const myP = power(s, fid);
    for (const f of Object.values(s.factions)) {
      if (!f.alive || f.id === fid) continue;
      const other = f.id;
      const st = stateOf(s, fid, other);
      let kind = '';
      if (st === 'war' && myP / Math.max(1, power(s, other)) < 0.6 && E().rand(s) < 0.1) kind = 'truce';
      else if (st === 'neutral' && E().rand(s) < 0.03) {
        if (atWarWith(s, fid).some((e) => stateOf(s, other, e) === 'war' && power(s, e) > myP)) kind = 'alliance';
      }
      if (!kind) continue;
      if (other === s.player) {
        s.pending = s.pending || [];
        if (!s.pending.some((p) => p.from === fid)) s.pending.push({ type: 'proposal', from: fid, kind });
      } else if (E().rand(s) < 0.5) {
        setState(s, fid, other, kind, kind === 'truce' ? 12 : 0);
        E().addLog(s, `${E().factionName(s, fid)}與${E().factionName(s, other)}${kind === 'alliance' ? '締結同盟' : '停戰'}。`, 'info', [fid, other]);
      }
    }
  }

  function respond(s, p, accept) {
    const fid = p.from;
    if (!s.factions[fid] || !s.factions[fid].alive) return '';
    const label = p.kind === 'alliance' ? '同盟' : '停戰';
    if (accept) {
      setState(s, fid, s.player, p.kind, p.kind === 'truce' ? 12 : 0);
      const msg = `接受了${E().factionName(s, fid)}的${label}提議。`;
      E().addLog(s, msg, 'major', [fid, s.player]);
      return msg;
    }
    rel(s, fid, s.player).rel -= 10;
    return `拒絕了${E().factionName(s, fid)}的${label}提議。`;
  }

  TK.Diplomacy = { STATE_LABEL, ACTIONS, rel, setState, stateOf, canAttack, onAttack, chance, exec, absorb, monthTick, aiConsider, respond, power, atWarWith };
})(globalThis.TK = globalThis.TK || {});

    // 山脈
    for (const [x, y, w, hh] of MOUNTAINS) {
      for (const [k, f] of [[-0.32, 0.65], [0, 1], [0.3, 0.72]]) {
        const px = x + w * k, ph = hh * f, pw = w * 0.45;

        ctx.fillStyle = 'rgba(51,43,36,.22)'; ctx.beginPath(); ctx.moveTo(...t); ctx.lineTo(...b); ctx.lineTo(...P([px + pw * 0.1, y])); ctx.fill();

    const rulerCity = {};

    for (const c of cities) {
      const [x, y] = P([c.x, c.y]);
      const fc = c.owner ? color(c.owner) : '#a39a8a';

      ctx.fillRect(...Q(-8, -12), 16 * S2, 9 * S2);
      ctx.beginPath(); ctx.moveTo(...Q(-15, -11)); ctx.lineTo(...Q(0, -19)); ctx.lineTo(...Q(15, -11)); ctx.fill();
      if (rulerCity[c.id] && c.owner) {
        ctx.fillRect(...Q(-5, -25), 10 * S2, 7 * S2);
        ctx.beginPath(); ctx.moveTo(...Q(-11, -24)); ctx.lineTo(...Q(0, -31)); ctx.lineTo(...Q(11, -24)); ctx.fill();

      ctx.fillStyle = PAPER; ctx.fillRect(...Q(-4, 6), 8 * S2, 7 * S2);
      // 勢力印章
      if (c.owner) {
        const [sx, sy] = Q(13, -33);
        ctx.fillStyle = fc; ctx.fillRect(sx, sy, 18 * S2, 18 * S2);
        ctx.strokeStyle = 'rgba(245,237,217,.95)'; ctx.lineWidth = 1.2 * S2; ctx.strokeRect(sx + 2 * S2, sy + 2 * S2, 14 * S2, 14 * S2);
        const ruler = state.factions[c.owner].ruler;
        ctx.fillStyle = '#f6eedb'; ctx.font = `bold ${Math.round(12 * S2)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ruler.slice(-1), sx + 9 * S2, sy + 9.5 * S2);

      const w = ctx.measureText(c.name).width + 14 * S2;
      const [px, py] = Q(0, 17);
      const mine = c.owner && c.owner === opts.player;
      ctx.fillStyle = c.owner ? fc : 'rgba(242,235,214,.95)';
      ctx.fillRect(px - w / 2, py, w, 22 * S2);
      ctx.strokeStyle = mine ? GOLD : c.owner ? 'rgba(245,237,217,.95)' : '#7d756a';
      ctx.lineWidth = (mine ? 2.5 : 1) * S2;

      const alive = Object.values(state.factions).filter((f) => f.alive);
      ctx.font = `${Math.round(14 * 2)}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

      }

  }

  function cityAt(state, canvas, clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    const x = (clientX - r.left) * canvas.width / r.width, y = (clientY - r.top) * canvas.height / r.height;
    let best = null, bd = 30 * Math.max(0.8, view.s);
    for (const c of Object.values(state.cities)) {

      const d = Math.hypot(cx - x, cy - y);
      if (d < bd) { bd = d; best = c.id; }

/* 晶片音樂風音效：以方波、三角波與雜訊即時合成（無外部音檔，旋律為原創）。 */
(function (TK) {
  'use strict';

    g.gain.setValueAtTime(vol || 0.05, t + dur * 0.8);

    o.start(t); o.stop(t + dur + 0.02);

    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);

    ok() { tone(988, 0.05, 'square', 0.04); tone(1319, 0.07, 'square', 0.04, 0.05); },

    toggle() {

      ul.replaceChildren(...items.map((it, i) => h('li', {
        class: (i === m.index ? 'sel ' : '') + (it.off ? 'off' : ''),
        onmouseenter: () => { if (m.index !== i) { m.index = i; m.render(); } },

      }, it.label, it.hint ? h('span', { class: 'hint' }, it.hint) : null)));

  // 表格選擇；multi 時可勾選多列
  function tableWin(title, cols, rows, onPick, opts) {
    opts = opts || {};
    const el = h('div', { class: 'win pop' }, h('h3', {}, title));
    const win = { el, index: Math.max(0, rows.findIndex((r) => !r.off)), marks: new Set(opts.marks || []) };
    const side = opts.side ? h('div', { class: 'side-card' }) : null;
    const table = h('table', { class: 'grid' });
    const scroller = h('div', { style: `max-height:${opts.maxH || 500}px;overflow:auto;flex:1` }, table);
    el.append(side ? h('div', { class: 'with-side' }, scroller, side) : scroller);
    const info = opts.info ? h('div', { class: 'info' }) : null;
    if (info) el.append(info);
    const total = rows.length + (opts.multi ? 1 : 0);
    const render = () => {
      const head = h('tr', {}, cols.map((c) => h('th', {}, c.label)));
      const trs = rows.map((r, i) => h('tr', {
        class: (i === win.index ? 'sel ' : '') + (r.off ? 'off' : ''),
        onmouseenter: () => { if (win.index !== i) { win.index = i; render(); } },
        onclick: () => { win.index = i; choose(); },
      }, r.cells.map((v, ci) => h('td', { class: (cols[ci].hl ? 'hl ' : '') + (opts.multi && ci === 0 && win.marks.has(i) ? 'mark' : '') },
        opts.multi && ci === 0 ? `${win.marks.has(i) ? '●' : '○'}${v}` : v))));
      if (opts.multi) {
        trs.push(h('tr', {
          class: win.index === rows.length ? 'sel' : '',
          onmouseenter: () => { if (win.index !== rows.length) { win.index = rows.length; render(); } },
          onclick: () => { win.index = rows.length; choose(); },
        }, h('td', { colspan: cols.length, style: 'text-align:center' }, `── 決定（已選 ${win.marks.size}）──`)));
      }
      table.replaceChildren(head, ...trs);
      const selTr = table.querySelectorAll('tr')[win.index + 1];
      if (selTr && selTr.scrollIntoView) selTr.scrollIntoView({ block: 'nearest' });
      if (side && rows[win.index]) side.replaceChildren(opts.side(rows[win.index]));
      if (info) info.textContent = rows[win.index] ? opts.info(rows[win.index], win) : '';
    };
    const choose = () => {
      if (opts.multi) {
        if (win.index === rows.length) {
          if (!win.marks.size) { SND.error(); return; }
          SND.ok();
          onPick([...win.marks].sort((a, b) => a - b).map((i) => rows[i]));
          return;
        }
        const r = rows[win.index];
        if (r.off) { SND.error(); return; }
        if (win.marks.has(win.index)) win.marks.delete(win.index);
        else if (win.marks.size < (opts.max || 99)) win.marks.add(win.index);
        else { SND.error(); say(null, `最多只能選 ${opts.max} 名。`); return; }
        SND.cursor();
        render();
        return;
      }
      const r = rows[win.index];
      if (!r || r.off) { SND.error(); if (r && r.why) say(null, r.why); return; }
      SND.ok();
      onPick(r, win.index);
    };
    win.onKey = (e) => {
      if (e.key === 'ArrowDown') { win.index = (win.index + 1) % total; SND.cursor(); render(); }
      else if (e.key === 'ArrowUp') { win.index = (win.index - 1 + total) % total; SND.cursor(); render(); }
      else if (e.key === 'PageDown') { win.index = Math.min(total - 1, win.index + 8); render(); }
      else if (e.key === 'PageUp') { win.index = Math.max(0, win.index - 8); render(); }
      else if (e.key === 'Enter' || e.key === ' ') choose();
      else if (e.key === 'Escape') { SND.cancel(); popWin(); if (opts.onCancel) opts.onCancel(); }
      else return false;
      return true;
    };
    render();
    return pushWin(win, opts);
  }
