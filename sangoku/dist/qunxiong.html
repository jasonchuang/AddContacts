:root {
  --paper: #efe5cf;
  --panel: #f8f1df;
  --panel-2: #fbf5e6;
  --line: rgba(59, 51, 42, .35);
  --ink: #1f1a14;
  --ink-2: #3b332a;
  --dim: #7d7062;
  --hi: #8a2a1f;
  --hi-bg: rgba(178, 58, 44, .12);
  --red: #b23a2c;
  --green: #3d7a4c;
  --gold: #b8892c;
  --hud: #231c15;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1a1612; overflow: hidden; }
body { font-family: Body, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color: var(--ink); user-select: none; }
.hidden { display: none !important; }
.px, h3, .btn { font-family: Pixel12, Body, sans-serif; }

/* ---------- 固定畫面縮放 ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; }
#app {
  position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px;
  transform: translate(-50%, -50%); transform-origin: center center; background: var(--paper); overflow: hidden;
}

/* ---------- 面板 ---------- */
.win {
  position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 6px 18px rgba(59, 51, 42, .22); padding: 12px 16px; font-size: 18px; line-height: 28px; color: var(--ink);
}
.win h3 { margin: 0 0 8px; font-size: 24px; line-height: 30px; font-weight: normal; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.win h3::before { content: ""; width: 7px; height: 7px; background: var(--red); flex: none; }
.dim { color: var(--dim); }
.hi { color: var(--hi); }
.red { color: var(--red); }
.green { color: var(--green); }
.gold { color: var(--gold); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.face { background: #e9eef4; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(0, 0, 0, .15); border-radius: 4px; object-fit: cover; }

/* ---------- 遊戲畫面版面 ---------- */
#status {
  left: 0; top: 0; width: 1280px; height: 60px; border-radius: 0; border: 0; border-bottom: 3px solid var(--red);
  background: var(--hud); color: #f6eedb; padding: 10px 18px; display: flex; gap: 22px; align-items: center; white-space: nowrap; font-size: 18px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .3);
}
#status .hi { color: #ffe3a8; font-family: Pixel12, Body, sans-serif; font-size: 24px; }
#status .seal { display: inline-grid; place-items: center; width: 30px; height: 30px; color: #fff; border: 2px solid rgba(255, 255, 255, .8); margin-right: 8px; vertical-align: middle; font-family: Pixel12, Body; }
#status .grow { flex: 1; text-align: right; color: #c9bda4; overflow: hidden; text-overflow: ellipsis; }
#map-win { left: 10px; top: 72px; width: 856px; height: 614px; padding: 0; overflow: hidden; background: var(--paper); }
#map { display: block; width: 856px; height: 614px; cursor: pointer; }
#city-win { left: 876px; top: 72px; width: 394px; height: 360px; padding: 12px 16px; overflow: hidden; }
#cmd-win { left: 876px; top: 442px; width: 394px; height: 244px; padding: 10px 8px; }
#msg-win { left: 10px; top: 696px; width: 1260px; height: 96px; padding: 10px 16px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; }
#msg-win .face { width: 74px; height: 74px; flex: none; }
.msg-main { flex: 1; min-width: 0; }
#msg-name { color: var(--hi); height: 26px; line-height: 26px; font-family: Pixel12, Body, sans-serif; font-size: 20px; }
#msg-text { line-height: 30px; white-space: pre-wrap; word-break: break-all; font-size: 19px; }
#msg-more { position: absolute; right: 16px; bottom: 6px; color: var(--red); animation: blink .7s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 城市資訊 */
.city-head { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 4px; }
.city-head .name { font-family: Pixel12, Body, sans-serif; font-size: 36px; line-height: 40px; color: var(--ink); }
.city-head .owner { font-size: 16px; padding: 0 8px; border-radius: 3px; color: #fff; margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: 52px 1fr 52px 1fr; column-gap: 8px; font-size: 17px; line-height: 26px; }
.kv .k { color: var(--dim); }
.kv .v { text-align: right; padding-right: 12px; font-variant-numeric: tabular-nums; }
.mixrow { display: flex; gap: 16px; font-size: 16px; margin-top: 2px; }
.gens-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 17px; }
.gens-line .acted { color: #b5aa98; }

/* ---------- 選單 ---------- */
.menu { list-style: none; margin: 0; padding: 0; }
.menu li { position: relative; padding: 0 12px 0 30px; height: 38px; line-height: 38px; cursor: pointer; white-space: nowrap; border-radius: 4px; font-size: 19px; }
.menu li.sel { background: var(--hi-bg); color: var(--hi); }
.menu li.sel::before { content: "▶"; position: absolute; left: 10px; color: var(--red); font-size: 13px; }
.menu li.off { color: #b5aa98; }
.menu li .hint { float: right; color: var(--dim); font-size: 15px; }
.menu-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; }
.menu-cols li { border: 1px solid var(--line); background: var(--panel-2); text-align: center; padding: 0 10px; font-family: Pixel12, Body, sans-serif; font-size: 22px; }
.menu-cols li.sel { border-color: var(--red); }
.menu-cols li.sel::before { display: none; }

/* 疊加視窗層 */
#layer { position: absolute; inset: 0; pointer-events: none; }
#layer .win { pointer-events: auto; z-index: 5; border: 1px solid rgba(59, 51, 42, .5); box-shadow: 0 0 0 4px rgba(248, 241, 223, .9), 0 0 0 5px rgba(59, 51, 42, .35), 0 16px 40px rgba(31, 26, 20, .4); }
#layer .shade { position: absolute; inset: 0; background: rgba(31, 26, 20, .45); pointer-events: auto; }
.pop { min-width: 260px; max-height: 640px; overflow: auto; }

/* 表格選擇 */
table.grid { border-collapse: collapse; width: 100%; font-size: 17px; }
table.grid th { color: var(--dim); font-weight: normal; padding: 0 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
table.grid th:first-child, table.grid td:first-child { text-align: left; }
table.grid td { padding: 0 8px; height: 34px; text-align: right; white-space: nowrap; cursor: pointer; font-variant-numeric: tabular-nums; border-bottom: 1px dotted rgba(59, 51, 42, .18); }
table.grid tr.sel td { background: var(--hi-bg); color: var(--hi); }
table.grid tr.sel td:first-child::before { content: "▶ "; color: var(--red); font-size: 12px; }
table.grid tr.off td { color: #b5aa98; }
table.grid td.mark { color: var(--green); font-weight: bold; }
table.grid td.hl { color: var(--gold); font-weight: bold; }
table.grid tr.sel td.hl { color: var(--hi); }

.with-side { display: flex; gap: 16px; align-items: flex-start; }
.side-card { width: 200px; flex: none; text-align: center; }
.side-card .face { width: 150px; height: 150px; }
.side-card .face.big { width: 180px; height: 225px; }
.side-card .desc { font-size: 17px; line-height: 26px; text-align: left; margin-top: 6px; }

/* 數值輸入 */
.numbox { text-align: center; padding: 8px 0; }
.numbox .big { font-family: Pixel12, Body; font-size: 48px; line-height: 56px; color: var(--hi); }
.numbox .arrows { color: var(--dim); }
.numbox .btns { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
.btn {
  display: inline-block; padding: 0 12px; height: 36px; line-height: 34px; cursor: pointer; font-size: 20px;
  border: 1px solid rgba(59, 51, 42, .45); border-radius: 4px; background: var(--panel-2); color: var(--ink);
}
.btn:hover { border-color: var(--red); color: var(--hi); }
.info { color: var(--dim); font-size: 16px; line-height: 26px; margin-top: 6px; white-space: pre-wrap; }

/* 兵種分配 */
.alloc .row { display: grid; grid-template-columns: 34px 80px 1fr 110px; align-items: center; height: 42px; padding: 0 6px; cursor: pointer; border-radius: 4px; }
.alloc .row.sel { background: var(--hi-bg); color: var(--hi); }
.alloc .row .val { text-align: right; color: var(--hi); font-family: Pixel12, Body; font-size: 24px; }
.alloc .row .have { color: var(--dim); font-size: 15px; }
.alloc .row img { width: 24px; height: 32px; }
.alloc .row.ok { grid-template-columns: 1fr; text-align: center; font-family: Pixel12, Body; font-size: 22px; }

/* 武將列傳 */
.detail { display: flex; gap: 22px; }
.detail .face { width: 200px; height: 250px; }
.detail .stats { display: grid; grid-template-columns: 60px 46px 190px; row-gap: 4px; align-items: center; margin-top: 6px; }
.detail .stats .bar { height: 10px; border-radius: 3px; background: currentColor; }
.detail .stats span:nth-child(3n+1) { color: var(--dim); }
.apt { display: flex; gap: 14px; margin-top: 10px; }
.apt span b { font-weight: bold; margin-left: 2px; }
.g-S { color: #b23a2c; } .g-A { color: #a8743a; } .g-B { color: #2f5f8f; } .g-C { color: #3d7a4c; }

/* ---------- 標題 ---------- */
.screen { position: absolute; inset: 0; }
#title-bg { position: absolute; inset: 0; width: 1280px; height: 800px; filter: brightness(.75) saturate(.85); }
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.title-logo {
  font-family: Pixel12, Body, sans-serif; font-size: 120px; line-height: 132px; color: var(--ink); letter-spacing: 12px;
  text-shadow: 0 0 2px var(--paper), 4px 4px 0 rgba(239, 229, 207, .9), -2px -2px 0 rgba(239, 229, 207, .9);
}
.title-sub { font-size: 28px; color: var(--ink-2); margin: 6px 0 30px; text-shadow: 0 0 6px var(--paper), 0 0 2px var(--paper); }
#title-menu .win { position: relative; min-width: 380px; }
#title-menu .menu li { font-family: Pixel12, Body, sans-serif; font-size: 24px; height: 44px; line-height: 44px; }

  <script>
/* js/engine.js */
/* 遊戲核心：狀態、指令、戰鬥、回合結算。不碰 DOM，可在 Node 中測試。 */
(function (TK) {
  'use strict';

  const MAX = { farm: 999, commerce: 999, defense: 999, order: 100, train: 100 };
  const NEUTRAL = { lead: 45, war: 45, int: 40 };
  const FREE_STATS = { name: '守軍' };

  // ---------- 亂數（可存檔、可重現） ----------
  function rand(s) {
    let t = (s.seed = (s.seed + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rint(s, a, b) { return a + Math.floor(rand(s) * (b - a + 1)); }
  function pick(s, arr) { return arr[Math.floor(rand(s) * arr.length)]; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- 建立 / 查詢 ----------
  function newGame(playerFaction, seed, mode) {
    const sc = JSON.parse(JSON.stringify(TK.SCENARIO));
    const s = {
      version: 1,
      year: sc.year,
      month: sc.month,
      seed: (seed === undefined ? Date.now() : seed) | 0,
      player: playerFaction,
      factions: {},
      cities: {},
      generals: {},
      roads: sc.roads,
      log: [],
      over: null,
      mode: mode || 'historical',
      relations: {},
      events_done: {},
      harvest_mult: 1,
      pending: [],
    };
    for (const f of sc.factions) s.factions[f.id] = Object.assign({ alive: true }, f);
    for (const c of sc.cities) { s.cities[c.id] = c; mixOf(c); }
    for (const g of sc.generals) s.generals[g.id] = Object.assign({ acted: false, formerFaction: null }, g);
    addLog(s, `${s.year}年，天下大亂，群雄並起。`, 'sys');
    return s;
  }

  const adjCache = new WeakMap();
  function neighbors(s, cityId) {
    let adj = adjCache.get(s.roads);
    if (!adj) {
      adj = {};
      for (const [a, b] of s.roads) {
        (adj[a] = adj[a] || []).push(b);
        (adj[b] = adj[b] || []).push(a);
      }
      adjCache.set(s.roads, adj);
    }
    return adj[cityId] || [];
  }
  function citiesOf(s, fid) { return Object.values(s.cities).filter((c) => c.owner === fid); }
  function generalsIn(s, cityId, pred) {
    return Object.values(s.generals).filter((g) => g.city === cityId && (!pred || pred(g)));
  }
  function officers(s, cityId) {
    const c = s.cities[cityId];
    return generalsIn(s, cityId, (g) => g.status === 'active' && g.faction === c.owner);
  }
  function factionName(s, fid) { return fid ? s.factions[fid].name : '無主勢力'; }
  function dateStr(s) { return `${s.year}年${s.month}月`; }
  function addLog(s, text, kind, factions) {
    s.log.push({ date: dateStr(s), text, kind: kind || 'info', factions: factions || [] });
    if (s.log.length > 400) s.log.splice(0, s.log.length - 400);
  }

  // ---------- 兵種 ----------
  // 槍剋騎、騎剋弩、弩剋槍。cost＝每 1000 兵所需金
  const UNITS = {
    spear: { name: '槍兵', short: '槍', cost: 100, desc: '陣型穩固、損失較少，剋制騎兵' },
    cav: { name: '騎兵', short: '騎', cost: 200, desc: '進攻時衝鋒加成，剋制弩兵' },
    xbow: { name: '弩兵', short: '弩', cost: 150, desc: '守城時加成、首輪齊射，剋制槍兵' },
  };
  const UNIT_KEYS = ['spear', 'cav', 'xbow'];
  const BEATS = { spear: 'cav', cav: 'xbow', xbow: 'spear' };
  const APT_MULT = { S: 1.18, A: 1.07, B: 1, C: 0.9 };

  function matchup(a, d) { return a === d ? 1 : BEATS[a] === d ? 1.3 : 0.8; }

  // 武將兵種適性：劇本可指定，否則依能力推得
  function aptitude(g, type) {
    if (!g) return 'C';
    const o = (TK.SCENARIO.aptitude || {})[g.name];
    if (o && o[type]) return o[type];
    if (type === 'spear') return g.lead >= 85 || g.war >= 88 ? 'A' : g.lead >= 68 ? 'B' : 'C';
    if (type === 'cav') return g.war >= 85 ? 'A' : g.war >= 70 ? 'B' : 'C';
    return g.int >= 85 ? 'A' : g.int >= 68 || g.lead >= 80 ? 'B' : 'C';
  }

  const FACTION_MIX = {
    ma: { spear: 0.3, cav: 0.5, xbow: 0.2 }, gongsun: { spear: 0.3, cav: 0.5, xbow: 0.2 }, dong: { spear: 0.35, cav: 0.45, xbow: 0.2 },
    sun: { spear: 0.4, cav: 0.15, xbow: 0.45 }, liubiao: { spear: 0.4, cav: 0.15, xbow: 0.45 },
  };
  function defaultMix(c) {
    const r = !c.owner ? { spear: 0.55, cav: 0.1, xbow: 0.35 } : FACTION_MIX[c.owner] || { spear: 0.45, cav: 0.25, xbow: 0.3 };
    const m = { spear: Math.floor(c.troops * r.spear), cav: Math.floor(c.troops * r.cav), xbow: 0 };
    m.xbow = c.troops - m.spear - m.cav;
    return m;
  }
  // 依比例分配 total，回傳整數且總和精確
  function scaleMix(mix, total) {
    const sum = UNIT_KEYS.reduce((a, k) => a + (mix[k] || 0), 0);
    const out = { spear: 0, cav: 0, xbow: 0 };
    if (total <= 0) return out;
    if (sum <= 0) { out.spear = total; return out; }
    let acc = 0, big = 'spear';
    for (const k of UNIT_KEYS) {
      out[k] = Math.floor((mix[k] || 0) * total / sum);
      acc += out[k];
      if ((mix[k] || 0) > (mix[big] || 0)) big = k;
    }
    out[big] += total - acc;
    return out;
  }
  // 取得城市兵種組成；troops 為準，組成不一致時依比例校正
  function mixOf(c) {
    if (!c.mix) c.mix = defaultMix(c);
    const sum = c.mix.spear + c.mix.cav + c.mix.xbow;
    if (sum !== c.troops) c.mix = scaleMix(c.mix, c.troops);
    return c.mix;
  }
  function addUnits(c, units, train) {
    mixOf(c);
    const n = UNIT_KEYS.reduce((a, k) => a + (units[k] || 0), 0);
    if (n <= 0) return;
    if (train !== undefined) c.train = Math.round((c.train * c.troops + train * n) / (c.troops + n));
    for (const k of UNIT_KEYS) c.mix[k] += units[k] || 0;
    c.troops += n;
  }
  function takeUnits(c, units) {
    mixOf(c);
    for (const k of UNIT_KEYS) { c.mix[k] -= units[k] || 0; c.troops -= units[k] || 0; }
  }
  function unitsTotal(u) { return UNIT_KEYS.reduce((a, k) => a + (u[k] || 0), 0); }
  // 指令可給 units（分兵種）或 troops（依城內比例）
  function unitsFromCmd(c, cmd) {
    mixOf(c);
    if (cmd.units) {
      const u = {};
      for (const k of UNIT_KEYS) {
        u[k] = Math.floor(cmd.units[k] || 0);
        if (u[k] < 0 || u[k] > c.mix[k]) return null;
      }
      return u;
    }
    const n = Math.floor(cmd.troops || 0);
    if (n < 0 || n > c.troops) return null;
    return scaleMix(c.mix, n);
  }
  function fractions(u) {
    const t = unitsTotal(u) || 1;
    return { spear: (u.spear || 0) / t, cav: (u.cav || 0) / t, xbow: (u.xbow || 0) / t };
  }
  function mixName(u) {
    return UNIT_KEYS.filter((k) => u[k] > 0).map((k) => `${UNITS[k].short}${u[k]}`).join('・') || '無兵';
  }

  // ---------- 指令 ----------
  const DEV = {
    farm: { label: '開墾', cost: 50, stat: 'pol', key: 'farm' },
    commerce: { label: '商業', cost: 50, stat: 'pol', key: 'commerce' },
    defense: { label: '築城', cost: 60, stat: 'lead', key: 'defense' },
    order: { label: '巡察', cost: 30, stat: 'cha', key: 'order' },
    train: { label: '訓練', cost: 0, stat: 'lead', key: 'train' },
  };

  function maxDraft(s, city, g, type) {
    const cost = UNITS[type || 'spear'].cost;
    return Math.max(0, Math.min(g.cha * 100, Math.floor(city.gold * 1000 / cost), Math.floor(city.pop / 5), 120000 - city.troops));
  }

  function recruitChance(s, g, target) {
    if (target.ruler) return 0;
    if (target.status === 'free') return clamp(0.15 + (g.cha / 100) * 0.55, 0, 0.75);
    if (target.status === 'prisoner') return clamp(0.05 + (g.cha / 100) * 0.45 - (target.loyalty - 50) / 200, 0.02, 0.6);
    return 0;
  }

  // 舊存檔補上新欄位
  function ensure(s) {
    if (!s.relations) s.relations = {};
    if (!s.events_done) s.events_done = {};
    if (!s.pending) s.pending = [];
    if (!s.mode) s.mode = 'historical';
    if (!s.harvest_mult) s.harvest_mult = 1;
  }

  // 回傳 {ok, msg}
  function exec(s, fid, cmd) {
    if (s.over) return fail('遊戲已結束');
    ensure(s);
    if (cmd.type === 'diplo') return TK.Diplomacy.exec(s, fid, cmd);
    const city = s.cities[cmd.city];
    if (!city || city.owner !== fid) return fail('不是我方城市');
    let g = null;
    const needsExec = !['reward', 'release', 'execute'].includes(cmd.type);
    if (needsExec) {
      g = s.generals[cmd.general];
      if (!g || g.faction !== fid || g.status !== 'active' || g.city !== city.id) return fail('武將不在此城');
      if (g.acted) return fail(`${g.name}本月已行動`);
    }

    if (DEV[cmd.type]) {
      const d = DEV[cmd.type];
      if (city.gold < d.cost) return fail('金不足');
      if (city[d.key] >= MAX[d.key]) return fail(`${d.label}已達上限`);
      city.gold -= d.cost;
      const st = g[d.stat];
      const gain = cmd.type === 'order' || cmd.type === 'train'
        ? Math.round(st / 20 + rint(s, 1, 4))
        : Math.round(st / 10 + rint(s, 0, 5));
      city[d.key] = Math.min(MAX[d.key], city[d.key] + gain);
      g.acted = true;
      return ok(`${g.name}於${city.name}${d.label}，${labelOf(d.key)} +${gain}`);
    }

    switch (cmd.type) {
      case 'draft': {
        const type = UNITS[cmd.unit] ? cmd.unit : 'spear';
        const amt = Math.floor(cmd.amount || 0);
        const max = maxDraft(s, city, g, type);
        if (amt < 100) return fail('徵兵數至少 100');
        if (amt > max) return fail(`最多可徵 ${max}`);
        city.gold -= Math.ceil(amt * UNITS[type].cost / 1000);
        city.pop -= amt;
        addUnits(city, { [type]: amt }, 20);
        city.order = Math.max(0, city.order - Math.ceil(amt / 2000));
        g.acted = true;
        return ok(`${g.name}於${city.name}徵募${UNITS[type].name} ${amt}`);
      }
      case 'search': {
        g.acted = true;
        const hidden = generalsIn(s, city.id, (x) => x.status === 'free' && x.hidden);
        if (hidden.length && rand(s) < 0.25 + g.int / 200) {
          const f = pick(s, hidden);
          f.hidden = false;
          return ok(`${g.name}在${city.name}發現了人才「${f.name}」！`);
        }
        if (rand(s) < 0.4) {
          const gold = rint(s, 30, 120);
          city.gold += gold;
          return ok(`${g.name}在${city.name}搜索，得到金 ${gold}`);
        }
        return ok(`${g.name}在${city.name}搜索，一無所獲`);
      }
      case 'recruit': {
        const t = s.generals[cmd.target];
        if (!t || t.city !== city.id || !(t.status === 'prisoner' || (t.status === 'free' && !t.hidden))) {
          return fail('找不到登用對象');
        }
        g.acted = true;
        const p = recruitChance(s, g, t);
        if (rand(s) < p) {
          joinFaction(t, fid, rint(s, 60, 80));
          t.acted = true;
          return ok(`${t.name}接受了${g.name}的邀請，加入${factionName(s, fid)}！`);
        }
        return ok(`${t.name}拒絕了${g.name}的登用`);
      }
      case 'reward': {
        const t = s.generals[cmd.target];
        if (!t || t.faction !== fid || t.city !== city.id || t.status !== 'active') return fail('找不到武將');
        if (t.ruler) return fail('不能賞賜君主');
        if (city.gold < 100) return fail('金不足');
        if (t.loyalty >= 100) return fail('忠誠已滿');
        city.gold -= 100;
        const gain = rint(s, 5, 10);
        t.loyalty = Math.min(100, t.loyalty + gain);
        return ok(`賞賜${t.name}，忠誠 +${gain}`);
      }
      case 'release':
      case 'execute': {
        const t = s.generals[cmd.target];
        if (!t || t.city !== city.id || t.status !== 'prisoner') return fail('找不到俘虜');
        if (cmd.type === 'release') {
          t.status = 'free';
          t.hidden = false;
          return ok(`釋放了${t.name}`);
        }
        t.status = 'dead';
        t.city = null;
        return ok(`處斬了${t.name}`);
      }
      case 'move': {
        const dest = s.cities[cmd.dest];
        if (!dest || dest.owner !== fid || !neighbors(s, city.id).includes(dest.id)) return fail('目的地不正確');
        const ids = uniq([g.id].concat(cmd.generals || []));
        const movers = ids.map((id) => s.generals[id]);
        for (const m of movers) {
          if (!m || m.faction !== fid || m.city !== city.id || m.status !== 'active' || m.acted) return fail('有武將無法移動');
        }
        const units = unitsFromCmd(city, cmd);
        const gold = Math.floor(cmd.gold || 0), food = Math.floor(cmd.food || 0);
        if (!units || gold < 0 || gold > city.gold || food < 0 || food > city.food) {
          return fail('兵、金或糧數量不正確');
        }
        const troops = unitsTotal(units);
        mixOf(dest);
        takeUnits(city, units);
        addUnits(dest, units, city.train);
        city.gold -= gold; dest.gold += gold;
        city.food -= food; dest.food += food;
        for (const m of movers) { m.city = dest.id; m.acted = true; }
        return ok(`${movers.map((m) => m.name).join('、')}率兵 ${troops} 移動至${dest.name}`);
      }
      case 'attack': {
        const target = s.cities[cmd.target];
        if (!target || target.owner === fid || !neighbors(s, city.id).includes(target.id)) return fail('無法進攻該城');
        if (TK.Diplomacy && !TK.Diplomacy.canAttack(s, fid, target.owner)) {
          return fail(`與${factionName(s, target.owner)}處於${TK.Diplomacy.STATE_LABEL[TK.Diplomacy.stateOf(s, fid, target.owner)]}，不能進攻`);
        }
        const ids = uniq([g.id].concat(cmd.generals || [])).slice(0, 3);
        const army = ids.map((id) => s.generals[id]);
        for (const m of army) {
          if (!m || m.faction !== fid || m.city !== city.id || m.status !== 'active' || m.acted) return fail('有武將無法出陣');
        }
        const units = unitsFromCmd(city, cmd);
        if (!units) return fail('兵力不足');
        const troops = unitsTotal(units);
        if (troops < 1000) return fail('出陣兵力至少 1000');
        const foodNeed = Math.ceil(troops / 10);
        if (city.food < foodNeed) return fail(`軍糧不足（需 ${foodNeed}）`);
        city.food -= foodNeed;
        takeUnits(city, units);
        for (const m of army) m.acted = true;
        if (TK.Diplomacy) TK.Diplomacy.onAttack(s, fid, target.owner);
        const res = battle(s, { faction: fid, generals: army, troops, units, train: city.train, from: city.id }, target.id);
        return ok(res.summary, res);
      }
      default:
        return fail('未知指令');
    }
  }

  function ok(msg, extra) { return Object.assign({ ok: true, msg }, extra ? { battle: extra } : {}); }
  function fail(msg) { return { ok: false, msg }; }
  function uniq(a) { return Array.from(new Set(a)); }
  function labelOf(k) {
    return { farm: '農業', commerce: '商業', defense: '城防', order: '民心', train: '訓練' }[k] || k;
  }

  function joinFaction(g, fid, loyalty) {
    g.faction = fid;
    g.status = 'active';
    g.hidden = false;
    g.loyalty = loyalty;
    g.formerFaction = null;
  }


  // ---------- 戰鬥 ----------
  function sideStats(gens) {
    if (!gens.length) return Object.assign({}, NEUTRAL);
    const cmdr = gens.slice().sort((a, b) => b.lead - a.lead)[0];
    return {
      lead: cmdr.lead,
      war: Math.max.apply(null, gens.map((x) => x.war)),
      int: Math.max.apply(null, gens.map((x) => x.int)),
      commander: cmdr,
    };
  }

  function battle(s, atk, targetId) {
    const city = s.cities[targetId];
    const defOwner = city.owner;
    const defGens = defOwner ? officers(s, city.id).sort((a, b) => b.lead - a.lead).slice(0, 3) : [];
    const A = Object.assign(sideStats(atk.generals), { troops: atk.troops, train: atk.train });
    const D = Object.assign(sideStats(defGens), { troops: city.troops, train: city.train });
    // 兵種：雙方組成比例、相剋、主將適性
    const aUnits = atk.units || { spear: atk.troops, cav: 0, xbow: 0 };
    const dUnits = Object.assign({}, mixOf(city));
    const fA = fractions(aUnits), fD = fractions(dUnits);
    let mA = 0, mD = 0, aptA = 0, aptD = 0;
    for (const a of UNIT_KEYS) {
      for (const d of UNIT_KEYS) { mA += fA[a] * fD[d] * matchup(a, d); mD += fD[d] * fA[a] * matchup(d, a); }
      aptA += fA[a] * APT_MULT[aptitude(A.commander, a)];
      aptD += fD[a] * (D.commander ? APT_MULT[aptitude(D.commander, a)] : 1);
    }
    const bonusA = mA * aptA * (1 + 0.12 * fA.cav);
    const bonusD = mD * aptD * (1 + 0.15 * fD.xbow);
    const sturdyA = 1 - 0.1 * fA.spear, sturdyD = 1 - 0.1 * fD.spear;
    const A0 = A.troops, D0 = D.troops;
    const aName = factionName(s, atk.faction), dName = factionName(s, defOwner);
    const parties = [atk.faction, defOwner].filter(Boolean);
    const lines = [];
    const aCmd = A.commander ? A.commander.name : '';
    const dCmd = D.commander ? D.commander.name : FREE_STATS.name;
    lines.push(`${aName}（${aCmd}，${A0}兵）自${atk.from}進攻${city.name}（${dName}，${dCmd}，${D0}兵）`);
    // frames：給戰鬥畫面逐格播放 {a, d, ev, kind}
    const frames = [{ a: A0, d: D0, ev: null }];
    const domA = UNIT_KEYS.reduce((b, k) => (fA[k] > fA[b] ? k : b), 'spear');
    const domD = UNIT_KEYS.reduce((b, k) => (fD[k] > fD[b] ? k : b), 'spear');
    if (mA > 1.06) lines.push(`兵種相剋：${aName}的${UNITS[domA].name}佔上風`);
    else if (mD > 1.06) lines.push(`兵種相剋：守軍的${UNITS[domD].name}佔上風`);

    // 單挑
    if (A.war >= 80 && D.war >= 80 && rand(s) < 0.3) {
      const ah = atk.generals.slice().sort((a, b) => b.war - a.war)[0];
      const dh = defGens.slice().sort((a, b) => b.war - a.war)[0];
      const ar = ah.war + rint(s, 0, 25), dr = dh.war + rint(s, 0, 25);
      const winner = ar >= dr ? ah : dh, loser = ar >= dr ? dh : ah;
      lines.push(`單挑！${ah.name} 對 ${dh.name}，${winner.name}擊退了${loser.name}`);
      if (winner === ah) D.troops = Math.round(D.troops * 0.9);
      else A.troops = Math.round(A.troops * 0.9);
      frames.push({ a: A.troops, d: D.troops, ev: `${ah.name} 對 ${dh.name}，${winner.name}勝！`, kind: 'duel', duel: [ah.name, dh.name], winner: winner === ah ? 'a' : 'd' });
    }

    let result = null, schemes = 0;
    for (let round = 1; round <= 20 && !result; round++) {
      const powA = A.troops * (0.6 * A.lead + 0.4 * A.war) / 100 * (0.7 + A.train / 100 * 0.6) * bonusA;
      const powD = D.troops * (0.6 * D.lead + 0.4 * D.war) / 100 * (0.7 + D.train / 100 * 0.6) * (1 + city.defense / 800) * bonusD;
      let lossD = Math.round(powA * 0.08 * (0.85 + rand(s) * 0.3) * sturdyD);
      let ev = null, kind = null;
      let lossA = Math.round(powD * 0.08 * (0.85 + rand(s) * 0.3) * sturdyA);
      if (round === 1) {
        // 開戰：弩兵齊射、騎兵衝鋒
        if (fA.xbow >= 0.3) { lossD = Math.round(lossD * (1 + fA.xbow)); ev = `${aName}弩兵齊射！`; kind = 'volley-a'; }
        if (fD.xbow >= 0.3) { lossA = Math.round(lossA * (1 + fD.xbow)); ev = `城上弩箭如雨！`; kind = 'volley-d'; }
        if (fA.cav >= 0.3) {
          if (fD.spear >= 0.4) { lossA = Math.round(lossA * 1.25); ev = '騎兵衝鋒，撞上槍陣！'; kind = 'charge-fail'; }
          else { lossD = Math.round(lossD * (1 + fA.cav * 0.8)); ev = `${aName}騎兵衝鋒！`; kind = 'charge'; }
        }
        if (ev) lines.push(ev);
      }
      if (A.int >= 75 && rand(s) < (A.int - 60) / 200) {
        lossD = Math.round(lossD * 1.5);
        ev = `${aName}施展計略，守軍陷入混亂`; kind = 'scheme-a';
        if (schemes++ < 2) lines.push(`${aName}施展計略，${city.name}守軍陷入混亂`);
      }
      if (D.int >= 75 && rand(s) < (D.int - 60) / 200) {
        lossA = Math.round(lossA * 1.5);
        ev = `${dName}識破敵計並反擊`; kind = 'scheme-d';
        if (schemes++ < 2) lines.push(`${dName}識破敵計並反擊`);
      }
      A.troops = Math.max(0, A.troops - lossA);
      D.troops = Math.max(0, D.troops - lossD);
      city.defense = Math.max(0, city.defense - rint(s, 3, 12));
      frames.push({ a: A.troops, d: D.troops, ev, kind });

      if (D.troops <= 0) result = 'win';
      else if (A.troops <= 0) result = 'lose';
      else if (D.troops < D0 * 0.2 && D.troops < A.troops * 0.5) { result = 'win'; D.troops = 0; }
      else if (A.troops < A0 * 0.3 && A.troops < D.troops) result = 'lose';
    }
    if (!result) { result = 'lose'; lines.push('久攻不下，撤兵'); }
    const aLeft = scaleMix(aUnits, A.troops);
    frames[frames.length - 1].a = A.troops;
    frames[frames.length - 1].d = D.troops;

    city.troops = D.troops;
    let summary;
    if (result === 'win') {
      conquer(s, city, atk, A, lines, aLeft);
      summary = `${aName}攻陷了${city.name}！（剩餘 ${A.troops} 兵）`;
    } else {
      const home = s.cities[atk.from];
      if (home.owner === atk.faction) addUnits(home, aLeft, atk.train);
      summary = `${aName}進攻${city.name}失敗（我損 ${A0 - A.troops}，敵損 ${D0 - D.troops}）`;
    }
    lines.push(summary);
    for (const l of lines) addLog(s, l, 'battle', parties);
    const res = {
      result, summary, lines, frames, atkLoss: A0 - A.troops, defLoss: D0 - D.troops,
      city: city.id, from: atk.from,
      atk: { faction: atk.faction, name: aName, commander: aCmd, generals: atk.generals.map((g) => g.name), troops: A0, units: aUnits },
      def: { faction: defOwner, name: dName, commander: dCmd, generals: defGens.map((g) => g.name), troops: D0, units: dUnits },
    };
    if (TK.Engine && typeof TK.Engine.onBattle === 'function') TK.Engine.onBattle(res);
    return res;
  }

  function conquer(s, city, atk, A, lines, aLeft) {
    const oldOwner = city.owner;
    const defenders = oldOwner ? generalsIn(s, city.id, (g) => g.status === 'active' && g.faction === oldOwner) : [];

  function tryAttack(s, fid, city) {

      const tl = gens.length ? Math.max.apply(null, gens.map((g) => g.lead)) : 45;

  function infoWin(title, content, opts) {
    opts = opts || {};
    const el = h('div', { class: 'win pop' }, h('h3', {}, title), content, h('div', { class: 'info', style: 'text-align:right' }, '（Enter／Esc 關閉）'));
    const win = { el };
    const close = () => { SND.cancel(); popWin(); if (opts.onClose) opts.onClose(); };
    el.addEventListener('click', close);
    win.onKey = (e) => {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { close(); return true; }
      return false;
    };
    return pushWin(win, opts);
  }

  function confirmWin(text, onYes, opts) {
    return menuWin(text, [{ label: '是', act: () => { popWin(); onYes(); } }, { label: '否', act: () => popWin() }], null, Object.assign({ width: 440 }, opts || {}));
  }

  // ---------- 鍵盤 ----------
  document.addEventListener('keydown', (e) => {
    if (e.repeat && (e.key === 'Enter' || e.key === ' ')) return;
    if (battleKey) { if (battleKey(e)) e.preventDefault(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && advanceMsg()) { e.preventDefault(); return; }
    const top = stack[stack.length - 1];
    if (top && top.onKey) { if (top.onKey(e)) e.preventDefault(); return; }
    if (rootKey && rootKey(e)) e.preventDefault();
  });

  // ---------- 標題 ----------
  function showTitle() {
    closeAll();
    S = null;
    $('game').classList.add('hidden');
    $('title').classList.remove('hidden');
    const preview = E.newGame(null, 1);
    MV.render($('title-bg'), preview, { selected: null, hovered: null, targets: [], blink: false, color: (f) => preview.factions[f].color, legend: false });
    const auto = meta(AUTO_KEY);
    const items = [
      { label: '新遊戲', act: chooseFaction },
      { label: '繼續遊戲', hint: auto, off: !auto, act: () => loadKey(AUTO_KEY) },
      { label: '讀取存檔', act: () => slotMenu(false) },
      { label: `音效：${SND.isMuted() ? '關' : '開'}`, act: () => { SND.toggle(); showTitle(); } },
    ];
    const m = makeMenu(items, (it) => it.act());
    $('title-menu').replaceChildren(h('div', { class: 'win' }, m.ul));
    rootKey = (e) => m.onKey(e);
  }

  function meta(key) {
    const raw = store(key);
    if (!raw) return '';
    try {
      const d = JSON.parse(raw);
      return d && d.version === 1 ? `${d.year}年${d.month}月 ${d.factions[d.player].name}` : '';
    } catch (e) { return ''; }
  }

  function chooseFaction() {
    const sc = TK.SCENARIO;
    const rows = sc.factions.map((f) => {
      const cities = sc.cities.filter((c) => c.owner === f.id);
      const gens = sc.generals.filter((g) => g.faction === f.id).length;
      const troops = cities.reduce((a, c) => a + c.troops, 0);
      const diff = troops >= 60000 ? 1 : troops >= 40000 ? 2 : troops >= 30000 ? 3 : troops >= 15000 ? 4 : 5;
      return { f, cities, cells: [f.name, f.ruler, cities.length, gens, fmtW(troops), '★'.repeat(diff)] };
    });
    tableWin('選擇君主　190年「群雄割據」', [{ label: '勢力' }, { label: '君主' }, { label: '城' }, { label: '將' }, { label: '兵力' }, { label: '難度' }], rows, (r) => {
      menuWin('劇本模式', [
        { label: '歷史劇本', hint: '依條件發生歷史事件', act: () => { closeAll(); newGame(r.f.id, 'historical'); } },
        { label: '自由模式', hint: '各勢力自由發展', act: () => { closeAll(); newGame(r.f.id, 'free'); } },
      ], null, { center: true, width: 620 });
    }, {
      center: true, width: 1000, shade: true,
      side: (r) => h('div', {}, face(Object.assign({ id: r.f.ruler }, sc.generals.find((g) => g.id === r.f.ruler)), 'full', 48, 60, 'big'),
        h('div', { class: 'desc' }, h('span', { style: `color:${r.f.color}` }, '■ '), r.f.name, h('br'), h('span', { class: 'dim' }, r.cities.map((c) => c.name).join('・')))),
    });
  }

  function slotMenu(saving) {
    const items = [];
    if (!saving) items.push({ label: '自動存檔', hint: meta(AUTO_KEY) || '（空）', off: !meta(AUTO_KEY), act: () => { closeAll(); loadKey(AUTO_KEY); } });
    for (let n = 1; n <= 3; n++) {
      const m = meta(SLOT_KEY(n));
      items.push({
        label: `存檔 ${n}`, hint: m || '（空）', off: !saving && !m,
        act: () => {
          closeAll();
          if (saving) say(null, store(SLOT_KEY(n), JSON.stringify(S)) ? `已存到存檔 ${n}。` : '此瀏覽器無法存檔。');
          else loadKey(SLOT_KEY(n));
        },
      });
    }
    menuWin(saving ? '存檔' : '讀檔', items, null, { center: true, width: 640, shade: true });
  }

  function loadKey(key) {
    try {
      const d = JSON.parse(store(key) || 'null');
      if (!d || d.version !== 1) throw new Error('bad');
      S = d;
      enterGame();
      say(null, `讀取了 ${E.dateStr(S)} 的記錄。`);
    } catch (e) { SND.error(); }
  }

  function newGame(fid, mode) {
    S = E.newGame(fid, undefined, mode);
    E.addLog(S, `你成為了${S.factions[fid].name}的君主。目標：統一天下！`, 'major', [fid]);
    enterGame();
    const ruler = S.generals[S.factions[fid].ruler];
    busy = true;
    const opening = TK.Events ? TK.Events.run(S) : [];
    banner().then(async () => {
      say(ruler, '天下大亂，正是英雄用武之時。諸位，隨我平定四方！', { wait: true });
      const adv = advisor();
      if (adv && adv !== ruler) await say(adv, '主公，請在地圖上點選城市，再從右下的選單下達指令。', { wait: true });
      await playEvents(opening);
      busy = false;
      render();
    });
  }

  function enterGame() {
    closeAll();
    $('title').classList.add('hidden');
    $('game').classList.remove('hidden');
    const mine = E.citiesOf(S, S.player);
    const cap = mine.find((c) => E.generalsIn(S, c.id, (g) => g.ruler && g.status === 'active').length) || mine[0];
    selected = cap ? cap.id : Object.keys(S.cities)[0];
    rootMenu = null;
    render();
    rootKey = (e) => rootMenu && rootMenu.onKey(e);
  }

  // ---------- 主畫面繪製 ----------
  function render() {
    if (!S) return;
    renderStatus();
    renderMap();
    renderCity();
    renderCmd();
  }

  function renderStatus() {
    const f = S.factions[S.player];
    const p = E.powerOf(S, S.player);
    const hov = hovered && S.cities[hovered];
    $('status').replaceChildren(
      h('span', { class: 'hi' }, `${S.year}年 ${MONTHS[S.month - 1]}（${SEASON(S.month)}）`),
      h('span', {}, h('span', { class: 'seal', style: `background:${f.color}` }, sealChar(f.ruler)), f.name),
      h('span', {}, `城${p.cities} 兵${fmtW(p.troops)} 金${fmtW(p.gold)} 糧${fmtW(p.food)} 將${p.generals}`),
      h('span', { class: 'grow' }, hov ? `${hov.name}（${E.factionName(S, hov.owner)}）兵${fmtW(hov.troops)}` : 'Tab 切換城市'));
  }

  function attackTargets() {
    const c = S.cities[selected];
    if (!c || c.owner !== S.player) return [];
    return E.neighbors(S, c.id).filter((id) => S.cities[id].owner !== S.player);
  }

  function renderMap() {
    MV.render($('map'), S, { selected, hovered, targets: attackTargets(), blink, color, player: S.player });
  }

  function renderCity() {
    const c = S.cities[selected];
    const box = $('city-win');
    if (!c) { box.replaceChildren(); return; }
    const mix = E.mixOf(c);
    const gens = c.owner ? E.officers(S, c.id) : [];
    const free = E.generalsIn(S, c.id, (g) => g.status === 'free' && !g.hidden);
    const pris = E.generalsIn(S, c.id, (g) => g.status === 'prisoner');
    const kv = (k, v) => [h('span', { class: 'k' }, k), h('span', { class: 'v' }, v)];
    box.replaceChildren(
      h('div', { class: 'city-head' }, h('span', { class: 'name' }, c.name), h('span', { class: 'owner', style: `background:${color(c.owner)}` }, E.factionName(S, c.owner))),
      h('div', { class: 'kv' }, kv('金', fmt(c.gold)), kv('糧', fmtW(c.food)), kv('人口', fmtW(c.pop)), kv('兵', fmtW(c.troops)),
        kv('農業', c.farm), kv('商業', c.commerce), kv('民心', c.order), kv('城防', c.defense), kv('訓練', c.train), kv('武將', gens.length)),
      h('div', { class: 'mixrow' }, UK.map((k) => h('span', {}, h('span', { class: 'dim' }, E.UNITS[k].short), fmtW(mix[k])))),
      h('div', { class: 'gens-line' }, gens.length ? gens.map((g, i) => h('span', { class: g.acted && c.owner === S.player ? 'acted' : '' }, (i ? ' ' : '') + g.name)) : h('span', { class: 'dim' }, '無人駐守')),
      ...(free.length || pris.length ? [h('div', { class: 'gens-line dim' }, free.length ? `在野 ${free.map((g) => g.name).join(' ')} ` : '', pris.length ? `俘虜 ${pris.map((g) => g.name).join(' ')}` : '')] : []));
  }

  function renderCmd() {
    const c = S.cities[selected];
    const mine = c && c.owner === S.player && !S.over;
    const items = [];
    if (mine) {
      const idle = E.officers(S, c.id).some((g) => !g.acted);
      const why = '本城的武將本月都已行動了。';
      items.push({ label: '內政', off: !idle || busy, why, act: () => domesticMenu(c) });
      items.push({ label: '軍事', off: !idle || busy, why, act: () => militaryMenu(c) });
      items.push({ label: '人事', off: busy, act: () => personnelMenu(c) });
    }
    items.push({ label: '外交', off: busy || !!S.over, act: diplomacyFlow });
    items.push({ label: '情報', act: () => infoMenu(c) });
    items.push({ label: '系統', act: systemMenu });
    items.push({ label: '結束本月', off: busy || !!S.over, act: endMonth });
    const keep = rootMenu ? rootMenu.index : 0;
    rootMenu = makeMenu(items, (it) => it.act(), { cols: true });
    rootMenu.index = Math.min(keep, items.length - 1);
    rootMenu.render();
    $('cmd-win').replaceChildren(h('h3', { style: 'padding-left:10px' }, mine ? `${c.name}・指令` : `${c ? c.name : ''}・情報`), rootMenu.ul);
  }

  // ---------- 武將表 ----------
  const STAT_COLS = [['統', 'lead'], ['武', 'war'], ['智', 'int'], ['政', 'pol'], ['魅', 'cha']];
  function genRows(list, opts) {
    opts = opts || {};
    return list.map((g) => ({
      g, off: opts.off ? opts.off(g) : false, why: opts.why,
      cells: [g.name + (g.ruler ? '★' : ''), ...STAT_COLS.map(([, k]) => g[k]), g.ruler || g.status !== 'active' ? '－' : g.loyalty, ...(opts.extra ? opts.extra(g) : [])],
    }));
  }
  function genCols(hlKey, extra) {
    return [{ label: '武將' }, ...STAT_COLS.map(([l, k]) => ({ label: l, hl: k === hlKey })), { label: '忠' }, ...(extra || []).map((l) => ({ label: l }))];
  }
  function genSide(r) {
    const g = r.g;
    const apt = UK.map((k) => h('span', { class: `g-${E.aptitude(g, k)}` }, `${E.UNITS[k].short}${E.aptitude(g, k)} `));
    return h('div', {}, face(g, 'head', 36, 36), h('div', { class: 'desc' }, g.name, h('br'), h('span', { class: 'dim' }, PT.classLabel(g, PT.traits(g))), h('br'), apt));
  }

  function pickGeneral(c, statKey, title, cb, opts) {
    opts = opts || {};
    const list = E.officers(S, c.id).filter((g) => !g.acted).sort((a, b) => b[statKey] - a[statKey]);
    if (!list.length) { SND.error(); say(null, '本城沒有可行動的武將。'); return; }
    tableWin(title, genCols(statKey), genRows(list), (r) => cb(r.g), { side: genSide, width: 800, x: 200, info: opts.info });
  }

  // ---------- 指令 ----------
  const DEV_SPEECH = {
    farm: (n) => `已帶領百姓開墾荒地，農業上升了 ${n}。`,
    commerce: (n) => `已整頓市集、招來商旅，商業上升了 ${n}。`,
    order: (n) => `已巡視城內、安撫百姓，民心上升了 ${n}。`,
    defense: (n) => `城牆已修築完畢，城防上升了 ${n}。`,
    train: (n) => `操練完成，士兵的訓練度上升了 ${n}。`,
  };

  function run(cmd, speaker, speech) {
    const r = E.exec(S, S.player, cmd);
    if (!r.ok) { SND.error(); say(null, r.msg); return null; }
    if (!r.battle) E.addLog(S, r.msg, 'info', [S.player]);
    closeAll();
    render();
    if (r.battle) {
      playBattle(r.battle).then(() => { render(); checkOver(); });
      return r;
    }
    const gain = (r.msg.match(/\+(\d+)/) || [])[1];
    say(speaker || null, speech ? speech(gain, r) : r.msg);
    return r;
  }

  const SUB = { x: 600, y: 360, width: 320 };

  function domesticMenu(c) {
    const item = (type) => {
      const d = E.DEV[type];
      return {
        label: d.label, hint: d.cost ? `金${d.cost}` : '', off: c.gold < d.cost, why: '金不足。',
        act: () => pickGeneral(c, d.stat, `${d.label}：選擇武將`, (g) => run({ type, city: c.id, general: g.id }, g, (n) => DEV_SPEECH[type](n))),
      };
    };
    menuWin('內政', ['farm', 'commerce', 'order', 'defense', 'train'].map(item), null, SUB);
  }

  function militaryMenu(c) {
    const adj = E.neighbors(S, c.id);
    menuWin('軍事', [
      { label: '徵兵', act: () => draftFlow(c) },
      { label: '出征', off: !adj.some((id) => S.cities[id].owner !== S.player), why: '附近沒有可進攻的城。', act: () => attackFlow(c) },
      { label: '移動', off: !adj.some((id) => S.cities[id].owner === S.player), why: '沒有相鄰的我方城市。', act: () => moveFlow(c) },
    ], null, SUB);
  }

  function searchSpeech(n, r) {
    const found = r.msg.match(/「(.+)」/);
    if (found) return `主公，在城中找到一位人才——${found[1]}！`;
    const gold = r.msg.match(/金 (\d+)/);
    if (gold) return `四處搜尋了一番，找到金 ${gold[1]}。`;
    return '四處搜尋了一番，什麼也沒找到……';
  }

  function personnelMenu(c) {
    const idle = E.officers(S, c.id).some((g) => !g.acted);
    const cand = E.generalsIn(S, c.id, (g) => (g.status === 'free' && !g.hidden) || g.status === 'prisoner');
    const pris = E.generalsIn(S, c.id, (g) => g.status === 'prisoner');
    const hasNonRuler = E.officers(S, c.id).some((g) => !g.ruler);
    menuWin('人事', [
      { label: '搜索', off: !idle, why: '本城的武將本月都已行動了。', act: () => pickGeneral(c, 'int', '搜索：選擇武將', (g) => run({ type: 'search', city: c.id, general: g.id }, g, searchSpeech)) },
      { label: '登用', off: !idle || !cand.length, why: cand.length ? '本城的武將本月都已行動了。' : '城中沒有可登用的人才，先搜索看看吧。', act: () => recruitFlow(c, cand) },
      { label: '賞賜', hint: '金100', off: c.gold < 100 || !hasNonRuler, why: c.gold < 100 ? '金不足。' : '沒有可以賞賜的武將。', act: () => rewardFlow(c) },
      { label: '俘虜', off: !pris.length, why: '沒有俘虜。', act: () => prisonerFlow(c, pris) },
    ], null, SUB);
  }

  function draftFlow(c) {
    pickGeneral(c, 'cha', '徵兵：選擇武將', (g) => {
      menuWin('徵兵：選擇兵種', UK.map((k) => ({
        label: E.UNITS[k].name, hint: `金${E.UNITS[k].cost}/千　適性${E.aptitude(g, k)}`,
        act: () => {
          const max = E.maxDraft(S, c, g, k);
          if (max < 100) { SND.error(); say(g, '金錢或人口不足，無法徵兵。'); return; }
          numberWin(`徵募${E.UNITS[k].name}`, {
            min: 100, max, value: Math.min(3000, max), step: 100, pos: { x: 420, y: 240 },
            info: (v) => `花費 金${Math.ceil(v * E.UNITS[k].cost / 1000)}　民心 -${Math.ceil(v / 2000)}\n${E.UNITS[k].desc}`,
          }, (v) => run({ type: 'draft', city: c.id, general: g.id, unit: k, amount: v }, g, () => `已徵募${E.UNITS[k].name} ${v} 人，即日起開始操練。`));
        },
      })), null, { x: 400, y: 220, width: 560 });
    });
  }

  function verdictOf(u, tm) {
    const fa = E.fractions(u), fd = E.fractions(tm);
    let m = 0;
    for (const a of UK) for (const d of UK) m += fa[a] * fd[d] * E.matchup(a, d);
    return m >= 1.06 ? '兵種佔優' : m <= 0.94 ? '兵種不利' : '兵種相當';
  }

  const iconCache = {};
  function unitIcon(k) {
    const key = `${k}|${S.player}`;
    if (!iconCache[key]) {
      let svg = TK.Icons.unit(k, color(S.player));
      if (!/xmlns=/.test(svg)) svg = svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
      iconCache[key] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    return iconCache[key];
  }

  function attackFlow(c) {
    const targets = E.neighbors(S, c.id).filter((id) => S.cities[id].owner !== S.player).map((id) => S.cities[id]);
    tableWin('出征：選擇目標', [{ label: '城' }, { label: '勢力' }, { label: '兵' }, { label: '槍' }, { label: '騎' }, { label: '弩' }, { label: '城防' }],
      targets.map((t) => { const m = E.mixOf(t); return { t, cells: [t.name, E.factionName(S, t.owner), fmtW(t.troops), fmtW(m.spear), fmtW(m.cav), fmtW(m.xbow), t.defense] }; }),
      (row) => {
        const t = row.t;
        const list = E.officers(S, c.id).filter((g) => !g.acted).sort((a, b) => (b.lead + b.war) - (a.lead + a.war));
        tableWin(`出征${t.name}：選擇武將（最多 3 名）`, genCols('lead', ['槍', '騎', '弩']), genRows(list, { extra: (g) => UK.map((k) => E.aptitude(g, k)) }), (picked) => {
          const gens = picked.map((r) => r.g);
          const mix = E.mixOf(c);
          const cmdr = gens.slice().sort((a, b) => b.lead - a.lead)[0];
          allocWin(`出征${t.name}：派遣兵力`, UK.map((k) => ({ key: k, label: E.UNITS[k].name, max: mix[k], init: Math.floor(mix[k] * 0.7 / 100) * 100, icon: unitIcon(k) })),
            (u) => {
              const n = u.spear + u.cav + u.xbow;
              return `出陣 ${n} 人（軍糧 ${Math.ceil(n / 10)}／城中 ${c.food}）主將 ${cmdr.name}\n守軍 ${fmtW(t.troops)}：${verdictOf(u, E.mixOf(t))}（槍剋騎・騎剋弩・弩剋槍）`;
            },
            (u) => {
              const ids = gens.map((g) => g.id);
              SND.march();
              run({ type: 'attack', city: c.id, general: ids[0], generals: ids, target: t.id, units: u });
            },
            {
              validate: (u) => u.spear + u.cav + u.xbow >= 1000 && c.food >= Math.ceil((u.spear + u.cav + u.xbow) / 10),
              why: (u) => (u.spear + u.cav + u.xbow < 1000 ? '出陣兵力至少要 1000。' : '軍糧不足。'),
              pos: { x: 320, y: 200 },
            });
        }, { multi: true, max: 3, marks: [0], side: genSide, width: 940, x: 160 });
      }, { width: 760, x: 300 });
  }

  function moveFlow(c) {
    const dests = E.neighbors(S, c.id).filter((id) => S.cities[id].owner === S.player);
    menuWin('移動：目的地', dests.map((id) => ({
      label: id, hint: `兵${fmtW(S.cities[id].troops)}`,
      act: () => {
        const list = E.officers(S, c.id).filter((g) => !g.acted);
        tableWin(`移動至${id}：選擇武將`, genCols('lead'), genRows(list), (picked) => {
          const mix = E.mixOf(c);
          const rows = UK.map((k) => ({ key: k, label: E.UNITS[k].name, max: mix[k], init: 0, icon: unitIcon(k) }));
          rows.push({ key: 'gold', label: '金', max: c.gold, init: 0, step: 100 }, { key: 'food', label: '糧', max: c.food, init: 0, step: 1000 });
          allocWin(`移動至${id}：運送`, rows, (v) => `兵 ${v.spear + v.cav + v.xbow}　金 ${v.gold}　糧 ${v.food}`, (v) => {
            const ids = picked.map((r) => r.g.id);
            run({ type: 'move', city: c.id, general: ids[0], generals: ids, dest: id, units: { spear: v.spear, cav: v.cav, xbow: v.xbow }, gold: v.gold, food: v.food },
              picked[0].g, () => `遵命，${picked.map((r) => r.g.name).join('、')}已前往${id}。`);
          }, { pos: { x: 320, y: 140 } });
        }, { multi: true, marks: [0], side: genSide, width: 800, x: 220 });
      },
    })), null, SUB);
  }

  function recruitFlow(c, cand) {

    render();
  }

  // ---------- 外交 ----------
  function diplomacyFlow() {
    const D = TK.Diplomacy;
    const rows = Object.values(S.factions).filter((f) => f.alive && f.id !== S.player).map((f) => {
      const r = D.rel(S, S.player, f.id);
      const p = E.powerOf(S, f.id);
      return { f, cells: [f.name, f.ruler, p.cities, fmtW(p.troops), D.STATE_LABEL[r.state] + (r.state === 'truce' ? `${r.months}月` : ''), (r.rel > 0 ? '+' : '') + r.rel] };
    });
    if (!rows.length) { say(null, '天下已無其他勢力。'); return; }
    tableWin('外交：選擇對象', [{ label: '勢力' }, { label: '君主' }, { label: '城' }, { label: '兵力' }, { label: '關係' }, { label: '友好' }], rows, (row) => {
      const fid = row.f.id;
      const envoys = Object.values(S.generals).filter((g) => g.faction === S.player && g.status === 'active' && !g.acted);
      const best = envoys.slice().sort((a, b) => b.cha + b.int - a.cha - a.int)[0];
      menuWin(`對${row.f.name}`, Object.entries(D.ACTIONS).map(([k, a]) => {
        const p = best ? D.chance(S, S.player, fid, k, best) : 0;
        return {
          label: a.label, hint: k === 'war' ? '' : (p > 0 ? `約${Math.round(p * 100)}%　金${a.cost}` : '不可'),
          off: !best || p <= 0, why: !best ? '本月沒有可以出使的武將。' : `目前無法${a.label}。`,
          act: () => {
            if (k === 'war') { confirmWin(`真的要向${row.f.name}宣戰嗎？`, () => sendEnvoy(fid, k, best)); return; }
            tableWin(`${a.label}：選擇使者（金${a.cost}，由使者所在城支出）`, genCols('cha', ['所在', '成功率']),
              genRows(envoys.sort((x, y) => D.chance(S, S.player, fid, k, y) - D.chance(S, S.player, fid, k, x)), {
                extra: (g) => [g.city, `${Math.round(D.chance(S, S.player, fid, k, g) * 100)}%`],
                off: (g) => S.cities[g.city].gold < a.cost, why: '使者所在城的金不足。',
              }), (r2) => sendEnvoy(fid, k, r2.g), { side: genSide, width: 960, x: 160 });
          },
        };
      }), null, { x: 560, y: 260, width: 420 });
    }, { width: 860, x: 200, side: (r) => h('div', {}, face(S.generals[r.f.ruler], 'head', 36, 36), h('div', { class: 'desc', style: `color:${r.f.color}` }, `■ ${r.f.name}`)) });
  }

  function sendEnvoy(fid, action, g) {
    const r = E.exec(S, S.player, { type: 'diplo', action, target: fid, general: g.id });
    closeAll();
    render();
    if (!r.ok) { SND.error(); say(null, r.msg); return; }
    const ruler = S.generals[S.factions[fid].ruler];
    if (action === 'war') { SND.march(); say(S.generals[S.factions[S.player].ruler], `${S.factions[fid].name}，戰場上見分曉吧！`); return; }
    if (r.success) { SND.win(); say(ruler || null, action === 'surrender' ? '……罷了，我願歸順。' : action === 'alliance' ? '好，兩家就此結盟，共進退。' : '也罷，暫且休兵吧。'); }
    else { SND.lose(); say(ruler || null, action === 'surrender' ? '要我投降？笑話！' : '此事恕難從命。'); }
    say(g, r.msg);
  }

  // 依序演出歷史事件
  async function playEvents(list) {
    for (const ev of list) {
      SND.event();
      await say(null, `【${ev.title}】`, { wait: true });
      for (const [sp, text] of ev.lines) await say(sp ? (S.generals[sp] || sp) : null, text, { wait: true });
    }
    if (list.length) render();
  }

  function proposals() {
    return new Promise((resolve) => {
      const next = () => {
        const p = (S.pending || []).shift();
        if (!p) { resolve(); return; }
        const f = S.factions[p.from];
        if (!f || !f.alive) { next(); return; }
        const label = p.kind === 'alliance' ? '同盟' : '停戰（一年）';
        SND.event();
        say(S.generals[f.ruler] || null, `${f.name}派使者前來，提議兩家${label}。`).then(() => {
          menuWin(`${f.name}提議${label}`, [
            { label: '接受', act: () => { popWin(); say(null, TK.Diplomacy.respond(S, p, true)); render(); next(); } },
            { label: '拒絕', act: () => { popWin(); say(null, TK.Diplomacy.respond(S, p, false)); render(); next(); } },
          ], null, { center: true, width: 520, shade: true });
        });
      };
      next();
    });
  }

  // ---------- 換月 ----------
  function banner() {
    const b = $('banner');
    b.replaceChildren(h('div', { class: 'win' }, h('div', { class: 'y' }, `${S.year}年`), h('div', { class: 'm' }, `${MONTHS[S.month - 1]}・${SEASON(S.month)}`)));
    b.classList.remove('hidden');
    SND.month();
    return wait(1400).then(() => b.classList.add('hidden'));
  }

  function advisor() {
    const gens = Object.values(S.generals).filter((g) => g.faction === S.player && g.status === 'active' && !g.ruler);
    gens.sort((a, b) => b.int - a.int);
    return gens[0] || S.generals[S.factions[S.player].ruler];
  }

  function tips() {
    const out = [];
    const mine = E.citiesOf(S, S.player);
    if (S.month === 8) out.push('秋收已過，各城的糧倉都充實了。');
    for (const c of mine) {
      if (c.troops > 0 && c.food < c.troops / 40 * 3) { out.push(`${c.name}的糧食只夠撐三個月，請盡快運糧或開墾。`); break; }
    }
    let warned = false;
    for (const c of mine) {
      for (const n of E.neighbors(S, c.id)) {
        const o = S.cities[n];
        if (!warned && o.owner && o.owner !== S.player && o.troops > c.troops * 1.5 && o.troops > 8000) {
          out.push(`${E.factionName(S, o.owner)}在${o.name}屯兵${fmtW(o.troops)}，${c.name}恐有危險。`);
          warned = true;
        }
      }
    }
    for (const c of mine) {
      const free = E.generalsIn(S, c.id, (g) => g.status === 'free' && !g.hidden);
      if (free.length) { out.push(`${c.name}有在野人才${free[0].name}，不妨派人登用。`); break; }
    }
    if (!out.length) out.push(['主公，請下令。', '天下局勢瞬息萬變，不可大意。', '兵貴神速，若有良機，當一鼓作氣。', '百姓安居，方能長治久安。'][S.month % 4]);
    return out.slice(0, 2);
  }

  async function endMonth() {
    if (busy || S.over) return;
    busy = true;
    closeAll();
    renderCmd();
    const battles = [];
    E.onBattle = (r) => { if (r.atk.faction === S.player || r.def.faction === S.player) battles.push(r); };
    let fired = [];
    try { fired = E.endTurn(S) || []; } finally { E.onBattle = null; }
    store(AUTO_KEY, JSON.stringify(S));
    if (S.cities[selected].owner !== S.player) {
      const c = E.citiesOf(S, S.player)[0];
      if (c) selected = c.id;
    }
    render();
    await banner();
    for (const r of battles.slice(0, 3)) await playBattle(r);
    if (battles.length > 3) say(null, `另有 ${battles.length - 3} 場戰事，詳見記錄。`);
    await playEvents(fired);
    if (!S.over) await proposals();
    busy = false;
    render();
    if (checkOver()) return;
    const adv = advisor();
    for (const t of tips()) say(adv, t);
  }

  function checkOver() {
    if (!S.over) return false;
    const win = S.over.result === 'win';
    if (win) SND.win(); else SND.lose();
    const ruler = S.generals[S.factions[S.player].ruler];
    say(ruler, win ? '天下終於平定了。從今以後，百姓可以安居樂業了。' : '……大勢已去。只恨未能完成大業。', { wait: true }).then(() => {
      menuWin(win ? '天下統一' : '勢力覆滅', [{ label: '回到標題', act: showTitle }, { label: '查看地圖', act: () => popWin() }], null, { center: true, width: 440, shade: true });
    });
    return true;
  }

  // ---------- 戰鬥 ----------
  function sprite(ctx, type, x, y, col, flip, dead) {
    const P = (dx, dy, c, w, hh) => { ctx.fillStyle = c; ctx.fillRect(flip ? x - dx - (w || 1) + 1 : x + dx, y + dy, w || 1, hh || 1); };
    if (dead) { P(0, 7, '#5a1a14', 6, 2); P(2, 6, '#7a6a5a', 2, 1); return; }
    const skin = '#f1c99a', dark = '#1a1424';
    if (type === 'cav') {
      P(0, 4, '#7a4a24', 9, 3); P(8, 2, '#7a4a24', 2, 3); P(9, 1, dark, 1, 1);
      P(1, 7, '#4a2a14', 1, 2); P(3, 7, '#4a2a14', 1, 2); P(6, 7, '#4a2a14', 1, 2); P(8, 7, '#4a2a14', 1, 2);
      P(3, 0, skin, 2, 2); P(3, -1, dark, 2, 1); P(3, 2, col, 3, 2); P(6, -2, '#d8d8e0', 1, 5);
    } else if (type === 'xbow') {
      P(2, 0, skin, 2, 2); P(1, -1, dark, 4, 1); P(1, 2, col, 4, 4); P(1, 6, dark, 1, 2); P(3, 6, dark, 1, 2);
      P(4, 3, '#8a5a2a', 4, 1); P(7, 2, '#5a3a1a', 1, 3);
    } else {
      P(2, 0, skin, 2, 2); P(1, -1, dark, 4, 1); P(1, 2, col, 4, 4); P(1, 6, dark, 1, 2); P(3, 6, dark, 1, 2);
      P(5, -3, '#8a6a3a', 1, 10); P(5, -4, '#e0e0e8', 1, 1); P(0, 3, '#c8a040', 1, 2);
    }
  }

  function playBattle(r) {
    return new Promise((resolve) => {
      closeAll();
      const W = 290, H = 90;
      const cv = h('canvas', { width: W, height: H });
      const ctx = cv.getContext('2d');
      const aCol = color(r.atk.faction), dCol = color(r.def.faction);
      const side = (info, right) => {
        const g = S.generals[info.commander];
        const num = h('div', { class: 'troops' }, fmt(info.troops));
        const bar = h('div', { style: `width:100%;background:${right ? dCol : aCol}` });
        const mixTxt = UK.filter((k) => (info.units || {})[k] > 0).map((k) => `${E.UNITS[k].short}${fmtW(info.units[k])}`).join(' ');
        const el = h('div', { class: 'side' + (right ? ' right' : '') }, g ? face(g, 'head', 36, 36) : h('div', { class: 'face', style: 'width:96px;height:96px;display:grid;place-items:center;font-size:48px;color:#8a7a5c;background:#e6dcc4' }, '守'),
          h('div', { style: 'flex:1' }, h('div', { class: 'hi' }, `${info.name}${right ? '（守）' : '（攻）'}`), h('div', { class: 'dim' }, info.generals.length ? info.generals.join('・') : '守軍'), h('div', {}, mixTxt), num, h('div', { class: 'hp' }, bar)));
        return { el, num, bar };
      };
      const A = side(r.atk, false), D = side(r.def, true);
      const resultEl = h('div', { class: 'result hidden' });
      const duelEl = h('div', { class: 'duel hidden' });
      const box = h('div', { class: 'win battle' }, h('div', { class: 'top' }, A.el, h('div', { class: 'vs' }, '對'), D.el), cv, resultEl, duelEl,
        h('div', { class: 'info', style: 'text-align:right' }, 'Enter：略過'));
      const shade = h('div', { class: 'shade' });
      $('layer').append(shade, box);

      // 部隊配置
      const big = Math.max(r.atk.troops, r.def.troops, 1);
      const units = (info, right) => {
        const n = Math.max(6, Math.round(36 * info.troops / big));
        const cnt = E.scaleMix(info.units || { spear: info.troops }, n);
        const list = [];
        for (const k of ['cav', 'spear', 'xbow']) for (let i = 0; i < cnt[k]; i++) list.push(k);
        return list.map((k, i) => {
          const col = Math.floor(i / 6), row = i % 6;
          const bx = right ? W - 42 - col * 11 : 10 + col * 12;
          return { k, x: bx + (row % 2) * 3, y: 18 + row * 11, alive: true };
        });
      };
      const UA = units(r.atk, false), UD = units(r.def, true);
      let advance = 0, shakeA = 0, shakeD = 0, arrows = [];

      const draw = () => {
        ctx.imageSmoothingEnabled = false;
        for (let y = 0; y < H; y += 3) {
          for (let x = 0; x < W; x += 3) {
            const v = ((x * 7 + y * 13) % 11) / 11;
            ctx.fillStyle = y < 12 ? (v < 0.5 ? '#4a7ac8' : '#5a8ad8') : (v < 0.15 ? '#4d8834' : v > 0.9 ? '#73ad4f' : '#5c9a3f');
            ctx.fillRect(x, y, 3, 3);
          }
        }
        // 守方城牆
        ctx.fillStyle = '#4a4458'; ctx.fillRect(W - 28, 10, 28, H - 10);
        ctx.fillStyle = '#b0aab8'; ctx.fillRect(W - 26, 12, 24, H - 14);
        for (let y = 15; y < H; y += 6) { ctx.fillStyle = '#8a8496'; ctx.fillRect(W - 26, y, 24, 1); }
        for (let x = W - 26; x < W; x += 5) { ctx.fillStyle = '#4a4458'; ctx.fillRect(x, 7, 3, 4); }
        UA.forEach((u) => sprite(ctx, u.k, u.x + advance + (shakeA && u.alive ? (Math.random() * 3 | 0) - 1 : 0), u.y, aCol, false, !u.alive));
        UD.forEach((u) => sprite(ctx, u.k, u.x + (shakeD && u.alive ? (Math.random() * 3 | 0) - 1 : 0), u.y, dCol, true, !u.alive));
        arrows.forEach((a) => { ctx.fillStyle = '#f4f0e0'; ctx.fillRect(a.x, a.y, 4, 1); ctx.fillStyle = '#c03028'; ctx.fillRect(a.dir > 0 ? a.x + 3 : a.x, a.y, 1, 1); });
      };
      const apply = (f) => {
        const setSide = (U, cur, init, ui) => {
          const alive = init > 0 ? Math.ceil(U.length * cur / init) : 0;
          U.forEach((u, i) => { u.alive = i < alive; });
          ui.num.textContent = fmt(cur);
          ui.bar.style.width = `${init ? 100 * cur / init : 0}%`;
        };
        setSide(UA, f.a, r.atk.troops, A);
        setSide(UD, f.d, r.def.troops, D);
      };

      let i = 1, done = false, timer = null, anim = null, last = 0;
      const loop = (t) => {
        if (t - last > 60) {
          last = t;
          arrows = arrows.map((a) => ({ x: a.x + a.dir * 7, y: a.y + 0.3, dir: a.dir })).filter((a) => a.x > 0 && a.x < W);
          draw();
        }
        anim = requestAnimationFrame(loop);
      };
      const close = () => {
        cancelAnimationFrame(anim);
        clearTimeout(timer);
        battleKey = null;
        box.remove(); shade.remove();
        resolve();
      };
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        duelEl.classList.add('hidden');
        apply(r.frames[r.frames.length - 1]);
        const me = S.player, atkWon = r.result === 'win';
        let text, good = true;
        if (r.atk.faction === me) { text = atkWon ? '勝利' : '敗退'; good = atkWon; }
        else if (r.def.faction === me) { text = atkWon ? '失守' : '守住'; good = !atkWon; }
        else text = atkWon ? '攻陷' : '擊退';
        resultEl.textContent = text;
        resultEl.style.color = good ? 'var(--hi)' : 'var(--red)';
        resultEl.classList.remove('hidden');
        if (good) SND.win(); else SND.lose();
        const extra = r.lines.filter((l) => /被俘|逃往|獲救/.test(l)).slice(0, 3).join('　');
        say(null, r.summary + (extra ? `\n${extra}` : ''));
        battleKey = (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { close(); return true; } return false; };
        setTimeout(() => box.addEventListener('click', close), 200);
      };
      const step = () => {
        if (done) return;
        if (i >= r.frames.length) { finish(); return; }
        const prev = r.frames[i - 1], f = r.frames[i];
        apply(f);
        shakeA = f.a < prev.a ? 1 : 0;
        shakeD = f.d < prev.d ? 1 : 0;
        advance = Math.min(advance + 4, 90);
        let delay = 520;
        if (f.kind === 'duel') {
          duelEl.replaceChildren(face(S.generals[f.duel[0]], 'head', 36, 36), h('div', { class: 'vs2' }, '單挑'), face(S.generals[f.duel[1]], 'head', 36, 36));
          duelEl.classList.remove('hidden');
          SND.clash(); setTimeout(SND.clash, 260); setTimeout(SND.clash, 520);
          say(null, `單挑！${f.ev}`);
          delay = 1800;
          setTimeout(() => duelEl.classList.add('hidden'), 1600);
        } else {
          if (/volley/.test(f.kind || '')) {
            SND.volley();
            const dir = f.kind === 'volley-d' ? -1 : 1;
            for (let k = 0; k < 14; k++) arrows.push({ x: dir > 0 ? 50 + Math.random() * 40 : W - 50 - Math.random() * 40, y: 16 + Math.random() * 64, dir });
          } else if (i % 2) SND.drum(); else SND.clash();
          if (f.ev) { say(null, f.ev); delay = 950; }
        }
        i++;
        timer = setTimeout(step, delay);
      };
      battleKey = (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { finish(); return true; } return false; };
      apply(r.frames[0]);
      anim = requestAnimationFrame(loop);
      say(null, r.lines[0]);
      timer = setTimeout(step, 900);
    });
  }

  // ---------- 綁定 ----------
  function bind() {
    fit();
    addEventListener('resize', fit);
    const map = $('map');
    map.addEventListener('click', (e) => {
      if (!S || stack.length || battleKey) return;
      const id = MV.cityAt(S, map, e.clientX, e.clientY);
      if (id) selectCity(id);
    });
    map.addEventListener('mousemove', (e) => {
      if (!S) return;
      const id = MV.cityAt(S, map, e.clientX, e.clientY);
      if (id !== hovered) { hovered = id; map.style.cursor = id ? 'pointer' : 'default'; renderStatus(); renderMap(); }
    });
    $('msg-win').addEventListener('click', advanceMsg);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && S && !$('game').classList.contains('hidden') && !stack.length && !battleKey) {
        e.preventDefault();
        const list = e.altKey ? Object.values(S.cities) : E.citiesOf(S, S.player);
        if (!list.length) return;
        const idx = list.findIndex((c) => c.id === selected);
        selectCity(list[(idx + (e.shiftKey ? -1 : 1) + list.length) % list.length].id);
      }
    });
    setInterval(() => { blink = !blink; if (S && !$('game').classList.contains('hidden')) renderMap(); }, 450);
    // 首次互動時播放標題音樂（瀏覽器限制自動播放）
    let played = false;
    const firstPlay = () => { if (!played && !S) { played = true; SND.title(); } };
    addEventListener('pointerdown', firstPlay, { once: true });
    addEventListener('keydown', firstPlay, { once: true });
  }

  bind();
  const start = () => showTitle();
  if (document.fonts && document.fonts.load) document.fonts.load('24px Pixel12').then(start, start);
  else start();
})(globalThis.TK = globalThis.TK || {});

</script>
