<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群雄逐鹿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 共用的水墨濾鏡與漸層（地圖、肖像共用；不可 display:none，否則 Chrome 會忽略濾鏡） -->
  <svg class="ink-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="ink-rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
      </filter>
      <filter id="ink-wash" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="14" result="d"/>
        <feGaussianBlur in="d" stdDeviation="1.6"/>
      </filter>
      <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="5" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" result="d"/>
        <feGaussianBlur in="d" stdDeviation=".45"/>
      </filter>
      <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="2" stitchTiles="stitch" result="n"/>
        <feColorMatrix in="n" values="0 0 0 0 .38  0 0 0 0 .30  0 0 0 0 .20  0 0 0 .16 0"/>
      </filter>
      <filter id="paper-fiber" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.25" numOctaves="2" seed="11" result="n"/>
        <feColorMatrix in="n" values="0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .22  0 0 0 .12 0"/>
      </filter>
      <linearGradient id="mtn-ink" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1f1a14" stop-opacity=".78"/>
        <stop offset=".45" stop-color="#3b332a" stop-opacity=".38"/>
        <stop offset="1" stop-color="#3b332a" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="mtn-ink-far" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a5560" stop-opacity=".42"/>
        <stop offset="1" stop-color="#4a5560" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="p-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".72" stop-color="#efe5cf" stop-opacity="0"/>
        <stop offset="1" stop-color="#efe5cf" stop-opacity=".95"/>
      </linearGradient>
      <radialGradient id="p-halo">
        <stop offset="0" stop-color="#fff8e8" stop-opacity=".9"/>
        <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="map-burn">
        <stop offset=".62" stop-color="#6b4a2a" stop-opacity="0"/>
        <stop offset="1" stop-color="#6b4a2a" stop-opacity=".38"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- 標題畫面 -->
  <section id="title-screen" class="screen">
    <div id="title-landscape" class="title-landscape" aria-hidden="true"></div>
    <div class="title-inner">
      <div class="title-seal">亂世</div>
      <h1 class="game-title">群雄逐鹿</h1>
      <p class="tagline">烽煙四起・英雄並立・誰能一統天下</p>
      <div id="title-menu" class="title-menu"></div>
      <div id="faction-pick" class="faction-pick hidden"></div>
    </div>
  </section>

  <!-- 遊戲主畫面 -->
  <div id="game" class="game hidden">
    <header class="hud">
      <div class="brand">群雄逐鹿</div>
      <div class="date-badge" id="hud-date"></div>
      <div class="hud-faction" id="hud-faction"></div>
      <div class="hud-res" id="hud-res"></div>
      <div class="hud-btns">
        <button id="btn-save" class="ghost" title="存檔">存檔</button>
        <button id="btn-load" class="ghost" title="讀檔">讀檔</button>
        <button id="btn-menu" class="ghost" title="回到標題">標題</button>
        <button id="btn-sound" class="ghost" title="音效">♪</button>
      </div>
      <button id="btn-end" class="lacquer big">結束本月</button>
    </header>

    <main class="layout">
      <section class="map-frame">
        <svg id="map" viewBox="0 0 1000 720" role="img" aria-label="天下地圖"></svg>
        <div id="tip" class="tip hidden"></div>
      </section>
      <aside class="side">
        <div id="city-panel" class="panel"></div>
        <div id="faction-panel" class="panel"></div>
      </aside>
      <section class="log-wrap panel">
        <h2 class="panel-title">戰報</h2>
        <ol id="log"></ol>
      </section>
    </main>
  </div>

  <!-- 一般視窗 -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">取消</button>
        <button id="modal-ok" class="lacquer">確定</button>
      </div>
    </div>
  </div>

  <!-- 戰鬥畫面 -->
  <div id="battle" class="battle hidden" role="dialog" aria-modal="true">
    <div class="battle-box">
      <h2 id="battle-title" class="battle-title"></h2>
      <div class="armies">
        <div class="army" id="army-a"></div>
        <div class="vs">⚔</div>
        <div class="army" id="army-d"></div>
      </div>
      <div class="battlefield">
        <div class="units" id="units-a"></div>
        <div class="units right" id="units-d"></div>
      </div>
      <div id="battle-event" class="battle-event"></div>
      <ol id="battle-lines" class="battle-lines"></ol>
      <div id="battle-stamp" class="stamp hidden"></div>
      <div class="modal-actions">
        <button id="battle-skip" class="ghost">跳過</button>
        <button id="battle-ok" class="lacquer hidden">確定</button>
      </div>
    </div>
  </div>

  <div id="month-banner" class="month-banner hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/icons.js"></script>
  <script src="portraits/manifest.js"></script>
  <script src="js/portraits.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
